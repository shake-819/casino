<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>2−1 情報処理銀行</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --cover:#12264a;--cover2:#0b1a36;--paper:#f6f8fa;--paper2:#e8eef3;--rule:#b7c9d8;
  --ink:#14213a;--mut:#5a6b85;--gold:#d4af37;--gold2:#f6e27a;--shu:#c8322f;
  --up:#c62839;--dn:#1f6fd1;--ok:#1b7f4b;--bad:#b3261e;
  --mj:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
  --gt:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{min-height:100dvh;background:linear-gradient(180deg,var(--cover) 0,var(--cover2) 100%) fixed;color:var(--paper);font-family:var(--gt);line-height:1.55;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
#app{max-width:720px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit}
.cover{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-family:var(--mj);font-weight:800;font-size:clamp(22px,6vw,30px);line-height:1.15;background:linear-gradient(#f6e27a,#d4af37 60%,#8a6a12);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;letter-spacing:.42em;color:var(--gold2);font-size:11px;margin-top:2px}
.net{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:18px 0 10px;flex-wrap:wrap}
.net .lab{display:block;color:#a9b8d0;font-size:13px}
#net{font-family:var(--mj);font-weight:800;font-size:clamp(34px,10vw,52px);line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.net-r{text-align:right;font-size:12px;color:#a9b8d0;display:flex;flex-direction:column;gap:2px}
.net-r b{color:var(--gold2);font-family:var(--mj);letter-spacing:.08em}
.sumrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:16px}
.sumrow div{background:#ffffff12;border:1px solid #ffffff22;border-radius:10px;padding:7px 6px;text-align:center;min-width:0}
.sumrow span{display:block;font-size:11px;color:#a9b8d0}
.sumrow b{display:block;font-family:var(--mj);font-size:14px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--paper);color:var(--ink);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 8px 22px #0006;border-top:4px solid var(--gold)}
.card h2,.sec{font-family:var(--mj);font-size:19px;font-weight:800;margin-bottom:8px;color:var(--ink)}
.sec{color:var(--paper);margin:20px 0 10px}
.card h2 small{font-family:var(--gt);font-weight:400;color:var(--mut);font-size:13px;margin-left:4px}
.mut{color:var(--mut);font-size:13px}
.lab{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.amt{font-family:var(--mj);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 4px;padding:10px 12px;background:var(--paper2);border-radius:10px}
.two .lab{margin-top:0}
input,select{width:100%;min-height:46px;padding:8px 12px;border-radius:9px;border:1.5px solid var(--rule);background:#fff;color:var(--ink)}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #2a7fff;outline-offset:2px}
input[type=range]{padding:0;min-height:34px;accent-color:var(--cover);border:0;background:none}
.qs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.q{min-height:38px;padding:4px 12px;border-radius:999px;border:1.5px solid var(--rule);background:#fff;color:var(--ink);cursor:pointer}
.q:active{background:var(--paper2)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.btn{min-height:46px;padding:8px 18px;border-radius:10px;border:2px solid var(--cover);background:var(--cover);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.alt{background:#fff;color:var(--cover)}
.btn.sell{background:var(--dn);border-color:var(--dn)}
.btn.buy{background:var(--up);border-color:var(--up)}
.btn.s{min-height:38px;padding:4px 14px;font-size:14px}
.btn.gold{background:linear-gradient(#f6e27a,#c99a1c);border-color:var(--gold2);color:#2a1c00}
.btn.one{grid-column:1/-1}
/* 通帳 */
.book{border:1.5px solid var(--rule);border-radius:8px;overflow:hidden;font-size:12.5px;background:repeating-linear-gradient(#fff 0 32px,#f0f5f9 32px 64px)}
.bk-h,.bk-r{display:grid;grid-template-columns:3.6em 1fr 4.6em 4.6em 5.4em;gap:6px;padding:6px 8px;align-items:center;border-bottom:1px solid var(--rule)}
.bk-h{background:var(--cover);color:#fff;font-size:11.5px;font-weight:700}
.bk-h span:nth-child(n+3),.bk-r span:nth-child(n+3){text-align:right;font-variant-numeric:tabular-nums}
.bk-r .m{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk-r span:nth-child(1){color:var(--mut)}
.bk-e{padding:18px 10px;color:var(--mut);text-align:center}
.notice{display:flex;gap:8px;padding:7px 0;border-bottom:1px dashed var(--rule);font-size:13.5px}
.notice time{color:var(--mut);flex:none;font-variant-numeric:tabular-nums}
.notice.ok{color:var(--ok)}.notice.err{color:var(--bad)}
/* 投資 */
.syms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sym{background:var(--paper);color:var(--ink);border:2px solid transparent;border-radius:12px;padding:9px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:0}
.sym.on{border-color:var(--gold);box-shadow:0 0 0 2px #d4af3766}
.sym .tk{font-family:var(--mj);font-size:12px;color:var(--mut);font-weight:800;letter-spacing:.1em}
.sym b{font-size:12.5px;line-height:1.3;min-height:2.6em}
.sym .pr{font-family:var(--mj);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.chg{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}
.spark{display:block;height:28px;margin-top:2px}
.spark svg{width:100%;height:100%;display:block}
.ch-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ch-h .amt{font-size:28px;text-align:right;line-height:1.1}
.ch-h .chg{display:block;text-align:right}
#chart svg{width:100%;height:auto;display:block;margin:8px 0;border-radius:8px;background:#fff;border:1px solid var(--rule)}
#hinfo{font-size:13.5px;padding:8px 10px;background:var(--paper2);border-radius:8px;margin-bottom:6px}
.qrow{display:grid;grid-template-columns:1fr;gap:6px}
#qc{min-height:20px;font-size:13px;color:var(--mut)}
/* 定期 */
.ladder{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.ladder .q{display:flex;flex-direction:column;align-items:center;line-height:1.25;padding:5px 11px}
.ladder .q small{color:var(--up);font-weight:700}
.dur{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#fp{margin:10px 0 0;padding:10px 12px;background:var(--paper2);border-radius:8px;font-size:14px}
.item{padding:12px 0;border-bottom:1px dashed var(--rule)}
.item:last-child{border-bottom:0}
.item .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.prog{height:9px;background:var(--paper2);border-radius:99px;overflow:hidden;margin:8px 0 4px;border:1px solid var(--rule)}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2b6cb0,#4aa3ff)}
.lock{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--cover);color:var(--gold2);font-weight:700}
/* 融資 */
.cs{display:flex;align-items:center;gap:14px}
.cs b{font-family:var(--mj);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.bar{flex:1;height:12px;background:var(--paper2);border-radius:99px;overflow:hidden;border:1px solid var(--rule)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#c8322f,#d4af37,#1b7f4b)}
.co{background:var(--paper);color:var(--ink);border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:0 8px 22px #0006;border-left:6px solid var(--tc)}
.co-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.co-h b{font-family:var(--mj);font-size:18px}
.seal{display:inline-block;padding:2px 9px;border:2px solid var(--tc);color:var(--tc);border-radius:6px;font-family:var(--mj);font-weight:800;font-size:13px;transform:rotate(-4deg);letter-spacing:.06em;background:#fff}
.t1{--tc:#1b6f8a}.t2{--tc:#2c7a4b}.t3{--tc:#a07a12}.t4{--tc:#b3541e}.t5{--tc:#1a1a1a}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 12px;margin:10px 0;font-size:13.5px}
.facts span{color:var(--mut)}
.facts b{font-variant-numeric:tabular-nums}
.stars{color:var(--shu);letter-spacing:.05em}
.lp{margin:6px 0 10px;font-size:14px;padding:8px 10px;background:var(--paper2);border-radius:8px}
.row-l{padding:12px 0;border-bottom:1px dashed var(--rule);display:grid;gap:4px}
.row-l:last-child{border-bottom:0}
.due.bad{color:var(--bad);font-weight:700}
/* 振込 */
.tx-i{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--rule);flex-wrap:wrap}
.st{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--rule);background:#fff}
.st.pend{color:#8a6a12;border-color:#d4af37}.st.sent{color:var(--ok);border-color:var(--ok)}.st.cancel{color:var(--mut)}
.demo{padding:9px 12px;background:#fff6d6;border:1px solid #e6c55a;border-radius:8px;font-size:13px;margin-bottom:10px;color:#4a3a05}
.acno{font-family:var(--mj);font-size:26px;font-weight:800;letter-spacing:.14em}
/* nav */
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--cover2);border-top:1px solid #ffffff22;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
#tabs div{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#tabs button{background:none;border:0;color:#a9b8d0;padding:9px 2px 8px;min-height:56px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;position:relative}
#tabs button span{font-size:19px;line-height:1.2}
#tabs button.on{color:var(--gold2);font-weight:700}
#tabs button.on::before{content:'';position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--shu);border-radius:0 0 3px 3px}
#toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);max-width:min(92vw,520px);background:#0b1a36;color:#fff;border:1px solid var(--gold);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.err{border-color:#ff8a80;background:#4a1212}
#toast.ok{border-color:#7be0a8}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:400px){.bk-h,.bk-r{grid-template-columns:3.2em 1fr 3.9em 3.9em 4.6em;font-size:11.5px;gap:4px}.sym b{font-size:11.5px}}
</style></head>
<body>
<div id="app">
  <header class="cover">
    <div class="brand"><div class="logo">2−1 情報処理銀行</div><small>JOHO BANK</small></div>
    <a class="btn s gold" href="casino.html">カジノへ</a>
  </header>
  <section class="net">
    <div><span class="lab">純資産（手持ち＋預金＋投資＋定期−借入）</span><b id="net">0</b></div>
    <div class="net-r"><span>口座番号 <b id="acct"></b></span><span id="link"></span></div>
  </section>
  <div class="sumrow">
    <div><span>手持ち</span><b id="s-w">0</b></div>
    <div><span>預金</span><b id="s-d">0</b></div>
    <div><span>投資</span><b id="s-i">0</b></div>
    <div><span>定期</span><b id="s-f">0</b></div>
    <div><span>借入</span><b id="s-l">0</b></div>
  </div>
  <main id="view"></main>
</div>
<nav id="tabs" aria-label="メニュー"><div>
  <button data-t="acct" onclick="setTab('acct')"><span>💴</span>口座</button>
  <button data-t="inv" onclick="setTab('inv')"><span>📈</span>投資</button>
  <button data-t="fix" onclick="setTab('fix')"><span>🔒</span>定期</button>
  <button data-t="tx" onclick="setTab('tx')"><span>✉️</span>振込</button>
  <button data-t="loan" onclick="setTab('loan')"><span>🏛️</span>融資</button>
</div></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ============ 設定 ============ */
const KEY='cj_bank_v1', WK='cj_wallet';          // WK：カジノと共通の手持ちチップ
// 振込をSupabaseに送るときはここに入れる（空のままなら「形だけ」で保留になります）
// テーブル例: create table transfers(id text primary key, from_acct text, to_acct text, amount int, memo text, created_at timestamptz default now());
const SUPABASE={url:'',key:''};
const SYMS=[
  {id:'KDK',name:'ケイ電機',sub:'安定型・電機',tag:'低リスク',p0:500,vol:.0020},
  {id:'MRM',name:'ミライ・モータース',sub:'成長型・自動車',tag:'中リスク',p0:1200,vol:.0045},
  {id:'NVB',name:'ノヴァ・バイオ',sub:'急騰急落型・バイオ',tag:'高リスク',p0:150,vol:.0090}
];
// rate=期間中の利息(％)、term=返済期限(分)、max=最大融資額、diff=審査の厳しさ、rv=[審査基本秒,満額時の追加秒]
const LOANS=[
  {id:'sagi',name:'白鷺信用金庫',tier:'ホワイト',cls:'t1',rate:2,term:1440,max:3000,min:100,step:100,diff:70,stars:5,rv:[90,210]},
  {id:'aozora',name:'あおぞらファイナンス',tier:'優良',cls:'t2',rate:5,term:720,max:6000,min:200,step:200,diff:55,stars:4,rv:[60,120]},
  {id:'midori',name:'ミドリ・クレジット',tier:'ふつう',cls:'t3',rate:12,term:180,max:15000,min:500,step:500,diff:35,stars:3,rv:[40,80]},
  {id:'ogon',name:'黄金屋ローン',tier:'グレー',cls:'t4',rate:30,term:60,max:40000,min:1000,step:1000,diff:15,stars:2,rv:[20,40]},
  {id:'kuro',name:'ブラックキャット金融',tier:'ブラック',cls:'t5',rate:80,term:15,max:100000,min:2000,step:2000,diff:0,stars:1,rv:[10,20]}
];
const CO=id=>LOANS.find(c=>c.id==id);

/* ============ ユーティリティ ============ */
const $=s=>document.querySelector(s);
const fmt=n=>Math.round(n).toLocaleString('ja-JP');
const now=()=>Date.now();
const uid=()=>Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const num=s=>Math.max(0,Math.floor(+$(s).value)||0);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const randn=()=>{let u=0;while(!u)u=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*Math.random())};
const p2=n=>String(n).padStart(2,'0');
const fmtDate=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${p2(d.getHours())}:${p2(d.getMinutes())}`};
const fmtD=t=>{const d=new Date(t),n=new Date();return d.toDateString()==n.toDateString()?`${p2(d.getHours())}:${p2(d.getMinutes())}`:`${d.getMonth()+1}/${d.getDate()}`};
function fmtDur(ms){const s=Math.max(0,Math.ceil(ms/1000)),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;
  if(d)return `${d}日${h}時間`;if(h)return `${h}時間${p2(m)}分`;if(m)return `${m}分${p2(x)}秒`;return `${x}秒`}
function fmtMin(m){if(m>=1440&&m%1440==0)return `${m/1440}日`;if(m>=60&&m%60==0)return `${m/60}時間`;if(m>=60)return `${Math.floor(m/60)}時間${m%60}分`;return `${m}分`}

/* ============ 手持ちチップ（カジノと共通） ============ */
let memW=null;
function wRaw(){try{const v=JSON.parse(localStorage.getItem(WK));if(v&&Number.isFinite(v.chips))return v}catch(e){}return null}
function wallet(){const v=wRaw();if(v)return Math.max(0,Math.floor(v.chips));if(memW==null){memW=1000;setWallet(1000)}return memW}
function setWallet(n){memW=Math.max(0,Math.floor(n));try{localStorage.setItem(WK,JSON.stringify({chips:memW,t:now(),src:'bank'}))}catch(e){}}

/* ============ 株価シミュレーション ============ */
function stepSym(s,d,dt){
  const k=.0004;
  if(Math.random()<dt/60)s.mu=randn()*d.vol*.35;               // 平均60秒ごとにトレンドが変わる
  let lp=Math.log(s.p),j=0;
  lp+=(-k*(lp-Math.log(d.p0))+s.mu)*dt+d.vol*Math.sqrt(dt)*randn();
  if(Math.random()<.003*dt){j=(Math.random()<.5?-1:1)*(.02+Math.random()*.05)*Math.sqrt(d.vol/.0045);lp+=j}  // ニュースで急変
  s.p=Math.max(d.p0*.2,Math.exp(lp));
  return j;
}
const push=s=>{s.h.push(s.p);if(s.h.length>600)s.h.shift()};

/* ============ 状態 ============ */
function fresh(){
  const s={v:1,acct:String(100000+Math.floor(Math.random()*900000)),name:'',dep:0,hold:{},mk:{t:now(),s:{}},
    fixed:[],apps:[],loans:[],tx:[],led:[],log:[],credit:50,linked:false,tab:'acct',sel:'KDK'};
  SYMS.forEach(d=>{s.hold[d.id]={q:0,c:0};s.mk.s[d.id]={p:d.p0,mu:0,h:[d.p0]}});
  for(let i=0;i<120;i++)SYMS.forEach(d=>{const m=s.mk.s[d.id];stepSym(m,d,5);push(m)});
  return s;
}
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.v==1){SYMS.forEach(d=>{j.hold[d.id]=j.hold[d.id]||{q:0,c:0};j.mk.s[d.id]=j.mk.s[d.id]||{p:d.p0,mu:0,h:[d.p0]}});return j}}catch(e){}return null}
let S=load()||fresh();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

let tt;
function toast(m,k){const e=$('#toast');e.textContent=m;e.className='on '+(k||'');clearTimeout(tt);tt=setTimeout(()=>e.className='',3400)}
function note(m,k){S.log.unshift({t:now(),m,k:k||''});S.log=S.log.slice(0,30);toast(m,k)}
function dep(n,memo){n=Math.round(n);S.dep+=n;S.led.unshift({t:now(),m:memo,o:n<0?-n:0,i:n>0?n:0,b:S.dep});S.led=S.led.slice(0,40)}

/* 集計 */
const invV=()=>SYMS.reduce((a,d)=>a+S.hold[d.id].q*S.mk.s[d.id].p,0);
const fixV=()=>S.fixed.reduce((a,f)=>a+f.amt,0);
const owed=(l,t)=>l.amt+l.int+(t>l.due?Math.round(l.amt*.01*Math.floor((t-l.due)/60000)):0);
const loanV=t=>S.loans.reduce((a,l)=>a+owed(l,t),0);

/* ============ 時間経過の処理 ============ */
function advance(t,live){
  const el=(t-S.mk.t)/1000;if(el<=0)return;
  if(el>3){const n=Math.floor(Math.min(el,3600)/5);for(let i=0;i<n;i++)SYMS.forEach(d=>{const s=S.mk.s[d.id];stepSym(s,d,5);push(s)})}
  else SYMS.forEach(d=>{const s=S.mk.s[d.id],j=stepSym(s,d,el);push(s);
    if(j&&live)note(j>0?`📈 ${d.name}に好材料のニュース！株価が急上昇`:`📉 ${d.name}に悪材料のニュース… 株価が急落`,j>0?'ok':'err')});
  S.mk.t=t;
}
function processEvents(t){
  let ch=false;
  for(const f of S.fixed.slice()){if(t>=f.end){S.fixed=S.fixed.filter(x=>x!==f);dep(f.amt+f.int,`定期満期（${fmtMin(f.mins)}）`);note(`定期預金が満期！ 元本${fmt(f.amt)}＋利息${fmt(f.int)}を預金に戻しました`,'ok');ch=true}}
  for(const a of S.apps.slice()){if(t>=a.end){S.apps=S.apps.filter(x=>x!==a);const c=CO(a.co);ch=true;
    if(a.roll*100<a.p){dep(a.amt,`融資（${c.name}）`);S.loans.push({id:uid(),co:a.co,amt:a.amt,int:Math.round(a.amt*c.rate/100),start:t,due:t+c.term*60000,od:false});note(`${c.name}の審査に通過！ ${fmt(a.amt)}を預金に入金しました`,'ok')}
    else{S.credit=Math.max(0,S.credit-1);note(`${c.name}の審査に通りませんでした（信用スコア−1）`,'err')}}}
  for(const l of S.loans){if(!l.od&&t>l.due){l.od=true;S.credit=Math.max(0,S.credit-15);note(`${CO(l.co).name}の返済が延滞！ 信用スコア−15。延滞金が毎分増えます`,'err');ch=true}}
  return ch;
}

/* ============ 口座 ============ */
function setV(sel,v){$(sel).value=v;if(sel=='#qty')qtyPrev()}
function afterAct(msg){save();render();toast(msg,'ok')}
function doIn(){const a=num('#ma');if(a<1)return toast('金額を入力してください','err');if(a>wallet())return toast('手持ちチップが足りません','err');
  setWallet(wallet()-a);dep(a,'入金（カジノから）');afterAct(`${fmt(a)}チップを入金しました`)}
function doOut(){const a=num('#ma');if(a<1)return toast('金額を入力してください','err');if(a>S.dep)return toast('預金残高が足りません','err');
  dep(-a,'出金（カジノへ）');setWallet(wallet()+a);afterAct(`${fmt(a)}チップを手持ちに出金しました`)}

/* ============ 投資 ============ */
function selSym(id){S.sel=id;save();render()}
const maxBuy=()=>Math.floor(S.dep/S.mk.s[S.sel].p);
function qtyPrev(){const e=$('#qty');if(!e)return;const q=Math.max(0,Math.floor(+e.value)||0),p=S.mk.s[S.sel].p;$('#qc').textContent=q?`${fmt(q)}株 × ${p.toFixed(1)} ＝ 約${fmt(Math.round(p*q))}チップ`:''}
function buy(){const q=num('#qty');if(q<1)return toast('株数を入力してください','err');const d=SYMS.find(x=>x.id==S.sel),p=S.mk.s[d.id].p,cost=Math.round(p*q);
  if(cost>S.dep)return toast(`預金が足りません（必要 ${fmt(cost)}）`,'err');
  const h=S.hold[d.id];h.q+=q;h.c+=cost;dep(-cost,`株購入 ${d.id}×${q}`);afterAct(`${d.name}を${q}株買いました（${p.toFixed(1)}）`)}
function sell(){const q=num('#qty');const d=SYMS.find(x=>x.id==S.sel),h=S.hold[d.id];if(q<1)return toast('株数を入力してください','err');if(q>h.q)return toast(`保有は${h.q}株です`,'err');
  const p=S.mk.s[d.id].p,got=Math.round(p*q);h.c=q==h.q?0:h.c*(1-q/h.q);h.q-=q;dep(got,`株売却 ${d.id}×${q}`);afterAct(`${d.name}を${q}株売りました（${p.toFixed(1)}）`)}
function hinfo(){const h=S.hold[S.sel],p=S.mk.s[S.sel].p,v=h.q*p,pl=v-h.c;
  return h.q?`保有 <b>${fmt(h.q)}株</b> ／ 評価額 <b>${fmt(v)}</b> ／ 取得平均 ${(h.c/h.q).toFixed(1)} ／ 評価損益 <b class="${pl>=0?'up':'dn'}">${pl>=0?'+':''}${fmt(pl)}</b>`:'この銘柄は持っていません'}
function spark(h){const a=h.length<2?[h[0],h[0]]:h;let mn=Math.min(...a),mx=Math.max(...a);if(mx-mn<1e-9){mx+=1;mn-=1}
  const pts=a.map((v,i)=>`${(i/(a.length-1)*100).toFixed(1)},${(26-(v-mn)/(mx-mn)*24).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 100 28" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${a[a.length-1]>=a[0]?'#c62839':'#1f6fd1'}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`}
function chartSVG(h){const W=600,H=220,a=h.length<2?[h[0],h[0]]:h;let mn=Math.min(...a),mx=Math.max(...a);if(mx-mn<mn*.002){mx+=mn*.001;mn-=mn*.001}
  const pad=(mx-mn)*.14;mn-=pad;mx+=pad;const X=i=>i/(a.length-1)*W,Y=v=>H-(v-mn)/(mx-mn)*H;
  const pts=a.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' '),up=a[a.length-1]>=a[0],c=up?'#c62839':'#1f6fd1';
  const grid=[0,1,2,3].map(i=>{const y=(H/3*i).toFixed(1),v=mx-(mx-mn)/3*i;return `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#d6e1ea" stroke-width="1"/><text x="${W-6}" y="${Math.min(H-4,+y+13)}" text-anchor="end" font-size="12" fill="#5a6b85">${v.toFixed(1)}</text>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="株価チャート">${grid}<line x1="0" x2="${W}" y1="${Y(a[0]).toFixed(1)}" y2="${Y(a[0]).toFixed(1)}" stroke="#8d9db8" stroke-dasharray="4 4"/><polygon points="0,${H} ${pts} ${W},${H}" fill="${c}" opacity=".10"/><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round"/><circle cx="${W}" cy="${Y(a[a.length-1]).toFixed(1)}" r="4.5" fill="${c}"/></svg>`}

/* ============ 定期預金 ============ */
const rateFor=m=>Math.min(80,Math.round(1.5*Math.sqrt(m)*10)/10);   // ロックが長いほど利率アップ（上限80％）
function fdMins(){return clamp(Math.round((+$('#fv').value||0)*(+$('#fu').value)),1,43200)}
function fdPrev(){const a=num('#fa'),m=fdMins(),r=rateFor(m),i=Math.round(a*r/100);
  $('#fp').innerHTML=`ロック <b>${fmtMin(m)}</b> ／ 利率 <b>${r}%</b> ／ 満期受取 <b>${fmt(a+i)}</b>（利息 ${fmt(i)}）<br><span class="mut">満期日時 ${fmtDate(now()+m*60000)}</span>`}
function fdSet(v,u){$('#fv').value=v;$('#fu').value=u;fdPrev()}
function fdOpen(){const a=num('#fa');if(a<10)return toast('10チップ以上で預けられます','err');if(a>S.dep)return toast('預金が足りません','err');
  const m=fdMins(),r=rateFor(m),t=now();dep(-a,`定期預金（${fmtMin(m)}）`);
  S.fixed.push({id:uid(),amt:a,mins:m,rate:r,start:t,end:t+m*60000,int:Math.round(a*r/100)});afterAct(`定期預金を開始：${fmt(a)}チップを${fmtMin(m)}ロック`)}

/* ============ 振込（形だけ／Supabase接続で実送信） ============ */
const Remote={on:()=>!!(SUPABASE.url&&SUPABASE.key),
  async send(tx){if(!Remote.on())return{ok:false};
    try{const r=await fetch(SUPABASE.url+'/rest/v1/transfers',{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE.key,Authorization:'Bearer '+SUPABASE.key,Prefer:'return=minimal'},
      body:JSON.stringify({id:tx.id,from_acct:S.acct,to_acct:tx.to,amount:tx.a,memo:tx.memo})});return{ok:r.ok}}catch(e){return{ok:false}}}};
function setName(v){S.name=v.trim().slice(0,12);save()}
async function doTx(){const to=$('#tt').value.trim(),a=num('#ta'),memo=$('#tm').value.trim().slice(0,30);
  if(!/^\d{6}$/.test(to))return toast('相手の口座番号は6桁の数字です','err');if(to==S.acct)return toast('自分の口座には振り込めません','err');
  if(a<1)return toast('金額を入力してください','err');if(a>S.dep)return toast('預金が足りません','err');
  const tx={id:uid(),to,a,memo,t:now(),st:'pend'};dep(-a,`振込（${to}）`);S.tx.unshift(tx);S.tx=S.tx.slice(0,30);
  const r=await Remote.send(tx);if(r.ok)tx.st='sent';save();render();
  toast(r.ok?'振込を送信しました':'振込を受け付けました（DB未接続のため保留中）','ok')}
function cancelTx(id){const x=S.tx.find(t=>t.id==id);if(!x||x.st!='pend')return;x.st='cancel';dep(x.a,`振込取消（${x.to}）`);afterAct('振込を取り消して預金に戻しました')}

/* ============ 融資 ============ */
const pApprove=(c,amt)=>clamp(Math.round(110-c.diff+(S.credit-50)*.6-30*(amt/c.max)),3,97);
const reviewSec=(c,amt)=>Math.round(c.rv[0]+c.rv[1]*amt/c.max);
function lprev(id){const c=CO(id),e=$('#la-'+id),o=$('#lp-'+id);if(!e||!o)return;const a=+e.value,p=pApprove(c,a),i=Math.round(a*c.rate/100);
  o.innerHTML=`借入 <b>${fmt(a)}</b> → 返済 <b>${fmt(a+i)}</b><br>審査 約<b>${fmtDur(reviewSec(c,a)*1000)}</b> ／ 通過の見込み <b>${p}%</b>`}
function apply(id){const c=CO(id),a=+$('#la-'+id).value,t=now();
  if(S.loans.some(l=>l.od))return toast('延滞中の借入があるため、新しい申込はできません','err');
  if(S.apps.some(x=>x.co==id))return toast('この会社はすでに審査中です','err');
  const used=S.loans.filter(l=>l.co==id).reduce((s,l)=>s+l.amt,0);if(a+used>c.max)return toast(`この会社の融資枠を超えます（残り ${fmt(c.max-used)}）`,'err');
  S.apps.push({id:uid(),co:id,amt:a,start:t,end:t+reviewSec(c,a)*1000,p:pApprove(c,a),roll:Math.random()});
  afterAct(`${c.name}に${fmt(a)}チップの融資を申し込みました。審査結果をお待ちください`)}
function repay(id){const l=S.loans.find(x=>x.id==id);if(!l)return;const t=now(),o=owed(l,t);if(o>S.dep)return toast(`預金が足りません（返済額 ${fmt(o)}）`,'err');
  dep(-o,`融資返済（${CO(l.co).name}）`);S.loans=S.loans.filter(x=>x!==l);if(!l.od)S.credit=Math.min(100,S.credit+4);
  afterAct(l.od?'延滞分も含めて返済しました':'期限内に返済しました。信用スコア＋4')}

function updateLive(){
  const t=now(),w=wallet(),iv=invV(),fv=fixV(),lv=loanV(t),r=wRaw();
  $('#s-w').textContent=fmt(w);$('#s-d').textContent=fmt(S.dep);$('#s-i').textContent=fmt(iv);$('#s-f').textContent=fmt(fv);$('#s-l').textContent=fmt(lv);
  $('#net').textContent=fmt(w+S.dep+iv+fv-lv);$('#acct').textContent=S.acct;
  if(r&&r.src=='casino')S.linked=true;
  $('#link').textContent=S.linked?'カジノと連携中':'カジノ未連携（同じ場所に置くと連携）';
  document.querySelectorAll('[data-w]').forEach(e=>e.textContent=fmt(w));
  document.querySelectorAll('[data-cd]').forEach(e=>{const x=+e.dataset.cd-t;e.textContent=x>0?fmtDur(x):'まもなく'});
  document.querySelectorAll('[data-prog]').forEach(e=>{const[a,b]=e.dataset.prog.split(',').map(Number);e.style.width=clamp((t-a)/(b-a),0,1)*100+'%'});
  document.querySelectorAll('[data-owed]').forEach(e=>{const l=S.loans.find(x=>x.id==e.dataset.owed);if(l)e.textContent=fmt(owed(l,t))});
  document.querySelectorAll('[data-due]').forEach(e=>{const l=S.loans.find(x=>x.id==e.dataset.due);if(!l)return;const x=l.due-t;e.textContent=x>0?'期限まで '+fmtDur(x):'延滞中 '+fmtDur(-x)+'（延滞金が増加中）';e.classList.toggle('bad',x<=0)});
  if(S.tab=='inv'){
    SYMS.forEach(d=>{const s=S.mk.s[d.id],c=s.p/s.h[0]-1;
      document.querySelectorAll(`[data-pr="${d.id}"]`).forEach(e=>e.textContent=s.p.toFixed(1));
      document.querySelectorAll(`[data-chg="${d.id}"]`).forEach(e=>{e.textContent=(c>=0?'▲ +':'▼ −')+Math.abs(c*100).toFixed(2)+'%';e.className='chg '+(c>=0?'up':'dn')});
      const sp=document.querySelector(`[data-sp="${d.id}"]`);if(sp)sp.innerHTML=spark(s.h)});
    $('#chart').innerHTML=chartSVG(S.mk.s[S.sel].h);$('#hinfo').innerHTML=hinfo();qtyPrev();
  }
}

/* ============ 実行 ============ */
let lastSave=0;
function tick(){const t=now();advance(t,true);const ch=processEvents(t);
  if(ch){save();render()}else updateLive();
  if(t-lastSave>5000){save();lastSave=t}}
advance(now(),false);processEvents(now());render();save();
setInterval(tick,1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else tick()});
addEventListener('beforeunload',save);
addEventListener('storage',e=>{if(e.key==WK)updateLive()});
</script>
</body></html>
