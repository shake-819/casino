<div class="scr on" id="s0"><span class="suit" style="left:8%;top:12%">♠</span><span class="suit" style="right:10%;top:20%;color:#c0242b">♥</span><span class="suit" style="left:14%;bottom:12%;color:#c0242b">♦</span><span class="suit" style="right:8%;bottom:10%">♣</span>

<div class="grid"><button class="gc" onclick="play('bj')"><i>♠</i><b>ブラックジャック</b><span>ディーラーと勝負</span></button><button class="gc" onclick="play('pk')"><i>🃏</i><b>ポーカー</b><span>テキサスホールデム</span></button><button class="gc" onclick="play('ch')"><i>🎲</i><b>チンチロ</b><span>親はCPU</span></button><button class="gc" onclick="play('ru')"><i>🎡</i><b>ルーレット</b><span>ヨーロピアン</span></button><button class="gc" onclick="play('sl')"><i>🎰</i><b>スロット</b><span>ジャグラー風・目押し</span></button><button class="gc" onclick="location.href='bank.html'"><i>🏦</i><b>銀行</b><span>投資・定期・融資</span></button></div></div>

<script>
const $=s=>document.querySelector(s),col={10:'#2b6cb0',50:'#c0242b',100:'#222',500:'#7a3aa8'},RED=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
const WK='cj_wallet';const ldW=()=>{try{const v=JSON.parse(localStorage.getItem(WK));if(v&&Number.isFinite(v.chips))return Math.max(0,Math.floor(v.chips))}catch(e){}return null};
const slotAlive=()=>{try{const v=JSON.parse(localStorage.getItem('cj_slot'));return!!v&&(v.cr>=3||!!v.free||!!v.betOn||!!(v.bonus&&v.bonus.left>0))}catch(e){return false}};
let chips=ldW()??1000,bet=50,bets={},rot=0,busy=0,seq=0,base=0,bj,ch,pk;
const R=n=>{const a=new Uint32Array(1),m=Math.floor(2**32/n)*n;do crypto.getRandomValues(a);while(a[0]>=m);return a[0]%n};
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=R(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const deck=()=>shuf([...Array(52)].map((_,i)=>({r:i%13+2,s:Math.floor(i/13)})));
const L=r=>r<11?r:'JQKA'[r-11],cd=(c,h)=>{const n=!c.d;c.d=1;return`<div class="cd${n?' nw':''}${h?' bk':''}${c.s==1||c.s==2?' r':''}"${n?` style="animation-delay:${(c.o-base)*.3}s"`:''}>${L(c.r)}<b>${'♠♥♦♣'[c.s]}</b></div>`},dr=d=>{const c=d.pop();c.o=seq++;return c};
const dispW=()=>document.querySelectorAll('.bank').forEach(e=>e.textContent='🪙 '+chips.toLocaleString());
const saveW=()=>{try{localStorage.setItem(WK,JSON.stringify({chips:Math.floor(chips),t:Date.now(),src:'casino'}))}catch(e){}};
const upd=()=>{dispW();saveW()};
const broke=()=>chips<=0&&!slotAlive();
const syncW=()=>{const v=ldW();if(v!=null&&v!=chips){chips=v;dispW();if(!broke())$('#over').classList.remove('on');else showOver()}};
addEventListener('storage',e=>{if(e.key==WK)syncW()});addEventListener('pageshow',syncW);addEventListener('pagehide',saveW);document.addEventListener('visibilitychange',()=>document.hidden?saveW():syncW());
const st=h=>{$('#stage').innerHTML=h;base=seq},msg=t=>$('#m').textContent=t,chk=()=>{upd();if(broke())showOver()};
const show=i=>document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id==i));
const betRow=()=>`<div class="chips">${[10,50,100,500].map(v=>`<button class="ch${v==bet?' on':''}" style="--c:${col[v]}" onclick="setBet(${v})">${v}</button>`).join('')}</div>`;
function setBet(v){bet=v;document.querySelectorAll('.ch').forEach(b=>b.classList.toggle('on',+b.textContent==bet))}
const G={bj:['ブラックジャック',()=>bjPre()],pk:['ポーカー',()=>pkPre()],ch:['チンチロ',()=>chPre()],ru:['ルーレット',()=>ruPre()],sl:['スロット',()=>slPre()]};
function play(k){pkT++;show('s2');$('#gt').textContent=G[k][0];G[k][1]()}
function back(){if(JG&&(JG.ph=='spin'||JG.ph=='pull'))return;slHalt();pkT++;ruClr();show('s1')}
function bankAssets(){try{const b=JSON.parse(localStorage.getItem('cj_bank_v1'));if(!b)return 0;let a=Math.max(0,b.dep||0);(b.fixed||[]).forEach(f=>a+=f.amt||0);for(const k in(b.hold||{})){const q=b.hold[k].q||0,p=b.mk&&b.mk.s&&b.mk.s[k]?b.mk.s[k].p:0;a+=q*p}return Math.floor(a)}catch(e){return 0}}
function showOver(){const a=bankAssets(),bt=$('#ovb');
$('#ovp').textContent=a>=10?`チップがなくなりました。銀行に約${a.toLocaleString()}チップの資産があります。出金するか、融資を受けて再挑戦しよう`:'チップがなくなりました。再入店はできません。銀行で融資を受けて再挑戦しよう';
bt.textContent='🏦 銀行へ行く';bt.onclick=()=>{location.href='bank.html'};$('#over').classList.add('on')}
upd();if(broke())showOver();
/* ブラックジャック */
const val=h=>{let s=0,a=0;h.forEach(c=>{if(c.r==14){s+=11;a++}else s+=Math.min(c.r,10)});while(s>21&&a){s-=10;a--}return s};

<div class="jg-c"><button class="btn betb" id="jbet" onclick="jgBet()">BET<small>3枚</small></button><div class="lever" id="jlv" aria-label="レバー（下に引く／タップ）"><div class="knob"></div></div></div>
<div class="chips"><button class="btn s" id="jby" onclick="jgBuy()">1000チップ → 46クレジット</button><button class="btn s d" id="jca" onclick="jgCash()">精算</button><button class="btn s" id="ja" onclick="jgAuto()">ボーナスオート</button></div>
<div class="jg-t">🔔🔔🔔 14枚 ／ 🍇🍇🍇 8枚 ／ 🍒（左リール） 2枚 ／ 🔁🔁🔁 リプレイ<br>7-7-7 ＝ BIG（240枚） ／ 7-7-BAR ＝ REG（96枚）<br>GOGOランプが消えていても、7を目押しで揃えればBIG！<br>有効ラインは中段のみ。ボタンを押した位置から最大4コマ先まで引き込みます。<br>操作：BETボタン → レバーを下に引く（タップでもOK）→ 停止ボタン<br>キー操作：Space=BET／レバー ／ ←・↓・→（Z・X・C）=停止</div></div>`);
jgLvInit();jgUI();jgDraw();
jgMsg(JG.betOn?'BET済み。レバーを下げよう':JG.bonus?`${JG.bonus.t} 消化中！ レバーを下げて続けよう`:JG.hold?'GOGOランプ点灯中！ 7を目押ししよう（7-7-7=BIG／7-7-BAR=REG）':JG.cr<3&&!JG.free?'まずは「1000チップ → 46クレジット」で投入しよう':'BETボタン → レバーでスタート。7が来たら目押し！')}
function jgUI(){if(!JG||!$('#jc'))return;const idle=JG.ph=='idle';
$('#jc').textContent=JG.cr;$('#jw').textContent=JG.win;$('#jb').textContent=JG.betOn||JG.free?3:0;
$('#lamp').classList.toggle('on',JG.lamp);
$('#jbn').textContent=JG.bonus?`${JG.bonus.t} 残${JG.bonus.left}G`:JG.free?'REPLAY':'—';
const rdy=idle&&(JG.betOn||JG.bonus||JG.free);$('#jbet').disabled=!(idle&&!JG.betOn&&!JG.bonus&&!JG.free);$('#jlv').classList.toggle('off',!rdy);[0,1,2].forEach(i=>$('#jt'+i).disabled=!(JG.ph=='spin'&&JG.rl[i].mode=='spin'));
$('#jby').disabled=!idle;$('#jca').disabled=!idle||!!JG.betOn;
$('#ja').style.display=JG.bonus?'':'none';$('#ja').textContent=JG.auto?'オート停止':'ボーナスオート'}
function jgDraw(){if(!JG)return;const r=document.querySelectorAll('.rl');if(r.length<3)return;const H=r[0].offsetHeight/3;if(!H)return;
JG.rl.forEach((x,i)=>{const fp=JN+(((x.f%JN)+JN)%JN);r[i].firstChild.style.transform=`translateY(${(1-fp)*H}px)`})}
function jgBet(){if(!JG||JG.ph!='idle'||JG.betOn||JG.bonus)return;
if(JG.free)return jgMsg('リプレイ！ 投入は不要です。レバーを下げよう');
if(JG.cr<3)return jgMsg('クレジットが足りません。「1000チップ → 46クレジット」で投入してください');
JG.cr-=3;JG.betOn=1;jgSave();jgUI();jgMsg('BET完了！ レバーを下げよう')}
function jgLever(){if(!JG||JG.ph!='idle')return;
if(!JG.betOn&&!JG.bonus&&!JG.free)return jgMsg(JG.cr<3?'クレジットが足りません。「1000チップ → 46クレジット」で投入してください':'先にBETボタンを押してください');
JG.ph='pull';const lv=$('#jlv');if(lv){lv.classList.remove('pull');void lv.offsetWidth;lv.classList.add('pull')}
jgUI();clearTimeout(JG.tm);JG.tm=setTimeout(jgSpin,260)}
function jgLvInit(){const lv=$('#jlv');if(!lv)return;let y0=null,dy=0;const kn=lv.firstChild;
lv.onpointerdown=e=>{y0=e.clientY;dy=0;try{lv.setPointerCapture(e.pointerId)}catch(_){}};
lv.onpointermove=e=>{if(y0==null)return;dy=Math.max(0,Math.min(66,e.clientY-y0));kn.style.transform=`translateY(${dy}px)`};
lv.onpointerup=lv.onpointercancel=()=>{if(y0==null)return;const d=dy;y0=null;kn.style.transform='';if(d>=30||d<8)jgLever()}}
function jgSpin(){if(!JG||JG.ph!='pull')return;
if(!JG.bonus){if(JG.betOn)JG.betOn=0;else if(JG.free)JG.free=0}
let fl;
if(JG.bonus)fl={sm:'GRP',nw:0};
else{fl={sm:'NON',nw:0};const u=R(100000);
if(!JG.hold&&u<594){JG.hold=u<366?'BB':'RB';fl.nw=1}
else{const v=R(100000);fl.sm=v<13699?'REP':v<30092?'GRP':v<32949?'CHR':v<36282?'BEL':'NON'}}
fl.hold=JG.hold;JG.fl=fl;JG.win=0;JG.stops=[-1,-1,-1];JG.pre=false;
if(fl.nw&&R(5)==0){JG.pre=true;JG.lamp=true}
jgSave();JG.ph='spin';JG.rl.forEach(r=>r.mode='spin');
jgMsg(JG.bonus?'ボーナスゲーム！ 停止ボタンで止めよう':JG.pre?'✨ ペカッ！！ GOGO!! BIGかREG確定！ 7を狙え！':JG.hold?'GOGOランプ点灯中！ 7を目押ししよう':'停止ボタンで止めよう');
JG.run=1;JG.t=performance.now();requestAnimationFrame(jgLoop);jgUI();
clearTimeout(JG.tm);
if(JG.auto&&JG.bonus)JG.tm=setTimeout(()=>{jgStop(0);JG.tm=setTimeout(()=>{jgStop(1);JG.tm=setTimeout(()=>jgStop(2),350)},350)},450)}
function jgStop(r){if(!JG||JG.ph!='spin'||JG.rl[r].mode!='spin')return;
const f=Math.floor(JG.rl[r].f),p=((f%JN)+JN)%JN,c=jgPick(JG.fl,JG.stops,r,p);
JG.stops[r]=c.i;JG.rl[r].tg=f-c.d;JG.rl[r].mode='stop';jgUI()}
function jgLoop(t){if(!JG||!JG.run)return;const dt=Math.min(.05,Math.max(0,(t-JG.t)/1000));JG.t=t;let any=0,fin=0;
JG.rl.forEach(r=>{if(r.mode=='spin'||r.mode=='stop'){any=1;r.f-=JSPD*dt;if(r.mode=='stop'&&r.f<=r.tg){r.f=r.tg;r.mode='done';fin=1}}});
jgDraw();
if(fin&&JG.ph=='spin'&&JG.rl.every(r=>r.mode=='done'))jgEnd();
if(any&&JG.run)requestAnimationFrame(jgLoop);else JG.run=0}
function jgEnd(){const o=jgRole(JG.stops),fl=JG.fl;let win=0,t='ハズレ…';
JG.ph='idle';JG.rl.forEach(r=>r.mode='idle');
if(JG.bonus){win=8;JG.bonus.left--;JG.bonus.tot+=8;t=`ぶどう +8（${JG.bonus.t} 残り${JG.bonus.left}G）`;
if(JG.bonus.left<=0){t=`${JG.bonus.t} 終了！ 合計 +${JG.bonus.tot}クレジット`;JG.bonus=null;JG.auto=0}}
else if(o=='BB'||o=='RB'){JG.hold=null;JG.lamp=false;JG.bonus={t:o=='BB'?'BIG':'REG',left:o=='BB'?30:12,tot:0};t=o=='BB'?'🎉 BIG BONUS！！ 30ゲームで +240枚':'🎉 REG BONUS！！ 12ゲームで +96枚'}
else if(o=='GRP'){win=8;t='ぶどう +8'}
else if(o=='CHR'){win=2;t='チェリー +2'}
else if(o=='BEL'){win=14;t='🔔 ベル +14'}
else if(o=='REP'){JG.free=1;t='リプレイ！ 次のゲームは投入不要'}
else if(JG.hold){if(fl.nw&&!JG.lamp){JG.lamp=true;t='✨ ペカッ！！ GOGO!! BIGかREG確定！ 7を狙え！'}else t='ハズレ… GOGOランプ点灯中！ 7を目押ししよう'}
JG.cr+=win;JG.win=win;jgSave();jgUI();jgMsg(t);chk();
if(JG.auto&&JG.bonus)JG.tm=setTimeout(jgLever,700)}
function jgBuy(){if(!JG||JG.ph!='idle')return;if(chips<1000)return jgMsg('チップが足りません（1000チップ必要）');
chips-=1000;JG.cr+=46;upd();jgSave();jgUI();jgMsg('46クレジットを投入しました')}
function jgCash(){if(!JG||JG.ph!='idle')return;if(JG.cr<1)return jgMsg('精算できるクレジットがありません');
const c=Math.floor(JG.cr*1000/46);chips+=c;jgMsg(`${JG.cr}クレジットを精算：+${c.toLocaleString()}チップ`);JG.cr=0;JG.win=0;upd();jgSave();jgUI()}
function jgAuto(){if(!JG||!JG.bonus)return;JG.auto=JG.auto?0:1;if(JG.auto&&JG.ph=='idle')jgLever();jgUI()}
function slHalt(){if(JG){clearTimeout(JG.tm);JG.auto=0;JG.run=0}}
addEventListener('keydown',e=>{if(!JG||!$('#s2').classList.contains('on')||!$('#jbet')||e.target.tagName=='INPUT')return;
if(e.key==' '||e.key=='Enter'){e.preventDefault();if(JG.ph=='idle'){if(!JG.betOn&&!JG.bonus&&!JG.free)jgBet();else jgLever()}return}
const m={ArrowLeft:0,z:0,Z:0,ArrowDown:1,x:1,X:1,ArrowRight:2,c:2,C:2}[e.key];if(m!=null){e.preventDefault();jgStop(m)}});
addEventListener('keyup',e=>{if(e.key==' '&&JG&&$('#s2').classList.contains('on')&&$('#jbet'))e.preventDefault()});
</script></body></html>
