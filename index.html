/* ===== 3D GAME UI LAYER (stage 1) ===== */
:root{--ease3:cubic-bezier(.2,.9,.25,1.2)}
body{background:radial-gradient(ellipse 80% 55% at 50% -8%,#5a1620,transparent 70%),radial-gradient(ellipse at 50% 120%,#0b3a28 0,transparent 60%),radial-gradient(ellipse at top,#3a0d12,#120a0a 70%) fixed}
/* title screen */
#s0{--mx:0;--my:0;perspective:1100px}
.box{transform:rotateX(calc(var(--my)*-9deg)) rotateY(calc(var(--mx)*12deg));transform-style:preserve-3d;transition:transform .18s ease-out;background:linear-gradient(160deg,#ffffff14,#0007 55%),#0006;box-shadow:0 0 34px #d4af3766,inset 0 0 30px #d4af3733,0 2px 0 #8a6a12,0 4px 0 #6b4f0c,0 6px 0 #4a3608,0 8px 0 #2e2005,0 26px 40px #000c}
.box .sign{transform:translateZ(46px);filter:drop-shadow(0 1px 0 #8a6a12) drop-shadow(0 2px 0 #6b4f0c) drop-shadow(0 3px 0 #4a3608) drop-shadow(0 4px 0 #2e2005) drop-shadow(0 12px 14px #000a) drop-shadow(0 0 16px #d4af3777)}
.box small{transform:translateZ(24px)}
.box::before{transform:translateZ(-22px)}
#s0>.btn{transform:translateZ(0)}
.suit{text-shadow:0 1px 0 #000a,0 2px 0 #0009,0 3px 0 #0008,0 4px 0 #0007,0 10px 14px #000;opacity:.2}
@keyframes fl{from{transform:perspective(500px) translateY(0) rotateY(-28deg) rotateX(12deg)}to{transform:perspective(500px) translateY(-36px) rotateY(28deg) rotateX(-12deg) rotate(8deg)}}
/* buttons: chunky 3D keycaps */
.btn{position:relative;overflow:hidden;transform-style:preserve-3d;box-shadow:0 1px 0 #7a5810,0 2px 0 #6b4f0c,0 3px 0 #5c430a,0 4px 0 #4a3608,0 9px 14px #000a,0 0 18px #d4af3755,inset 0 2px 0 #fff8,inset 0 -3px 5px #0004;transition:transform .12s var(--ease3),box-shadow .12s,filter .15s}
.btn::before{content:'';position:absolute;left:6%;right:6%;top:2px;height:46%;border-radius:999px 999px 40% 40%;background:linear-gradient(#fffa,#fff0);pointer-events:none}
.btn:not(:disabled):hover{transform:translateY(-3px) perspective(500px) rotateX(10deg);filter:brightness(1.1) saturate(1.1)}
.btn:not(:disabled):active{transform:translateY(4px);box-shadow:0 0 0 #5c430a,0 2px 4px #000a,inset 0 3px 8px #0006;filter:brightness(.95)}
.btn.d{box-shadow:0 1px 0 #2a080c,0 2px 0 #220609,0 3px 0 #1a0407,0 4px 0 #120305,0 9px 14px #000a,inset 0 2px 0 #ffffff22,inset 0 -3px 5px #0006}
.btn.d::before{background:linear-gradient(#ffffff30,#fff0)}
/* lobby cards: tilt toward the pointer */
.grid{perspective:1000px}
.gc{position:relative;--rx:0deg;--ry:0deg;--px:50%;--py:0%;transform:rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;transition:transform .16s ease-out,box-shadow .25s,filter .25s;box-shadow:inset 0 0 30px #0008,inset 0 2px 0 #fff3,0 1px 0 #6b4f0c,0 2px 0 #5c430a,0 3px 0 #4a3608,0 4px 0 #2e2005,0 14px 22px #000a}
.gc::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--px) var(--py),#ffffff3a,transparent 52%),linear-gradient(135deg,#ffffff12,transparent 40%);opacity:.8;transition:opacity .2s}
.gc:hover{transform:rotateX(var(--rx)) rotateY(var(--ry)) translateY(-8px) scale(1.04);box-shadow:inset 0 0 30px #0008,inset 0 2px 0 #fff4,0 1px 0 #6b4f0c,0 2px 0 #5c430a,0 3px 0 #4a3608,0 4px 0 #2e2005,0 28px 34px #000c,0 0 26px #d4af3799}
.gc:active{transform:rotateX(var(--rx)) rotateY(var(--ry)) translateY(0) scale(.98)}
.gc i{transform:translateZ(38px);transition:transform .25s var(--ease3);filter:drop-shadow(0 6px 5px #000a)}.gc b{transform:translateZ(22px)}.gc span{transform:translateZ(12px)}
.gc>*{position:relative;transform-style:preserve-3d}.gc:hover i{transform:translateZ(62px) scale(1.12)}
/* HUD plate */
.bank{background:linear-gradient(#1a1204,#000);box-shadow:inset 0 2px 5px #000,0 1px 0 #f6e27a66,0 3px 0 #5c430a,0 8px 10px #0009;text-shadow:0 0 8px #d4af3788}
/* table: thick slab with felt & lamp light */
.table{position:relative;background:radial-gradient(ellipse 70% 55% at 50% 0,#ffffff1c,transparent 70%),repeating-linear-gradient(45deg,#ffffff05 0 1px,transparent 1px 4px),radial-gradient(ellipse at center,#12744a,var(--f2) 85%);border-color:#5a3516 #3d230d #2a1608 #4a2a12;box-shadow:0 0 0 3px var(--g),0 0 0 5px #6b4f0c,0 8px 0 4px #2a1608,0 16px 0 4px #1a0d04,0 36px 46px #000d,inset 0 0 70px #000b,inset 0 8px 0 #ffffff12,inset 0 -10px 24px #0007}
.msg{text-shadow:0 1px 0 #6b4f0c,0 2px 0 #3a2a06,0 5px 8px #000a}
/* playing cards: real thickness, dealt in 3D */
.cd{background:linear-gradient(135deg,#fff,#fffdf5 55%,#ebe4cf);box-shadow:0 1px 0 #d9d2bd,0 2px 0 #cbc3aa,0 3px 0 #b9b095,0 8px 12px #000b;transform-origin:50% 100%}
.cd.bk{box-shadow:0 1px 0 #d9d2bd,0 2px 0 #cbc3aa,0 3px 0 #b9b095,0 8px 12px #000b,inset 0 0 12px #0008}
@keyframes dl{from{transform:perspective(600px) translateY(-170px) translateX(40px) rotateX(70deg) rotate(-24deg) scale(1.2);opacity:0}60%{opacity:1}to{transform:perspective(600px)}}
@keyframes flp{from{transform:perspective(600px) rotateY(95deg) translateZ(30px)}60%{transform:perspective(600px) rotateY(-12deg) translateZ(20px)}}
/* chips: stacked-coin edges */
.ch{position:relative;filter:drop-shadow(0 1px 0 #000a) drop-shadow(0 2px 0 #0008) drop-shadow(0 3px 0 #0006) drop-shadow(0 7px 5px #0008);box-shadow:inset 0 0 0 3px var(--c),inset 0 -7px 9px #0005,inset 0 5px 6px #fff4;transition:transform .16s var(--ease3),filter .16s}
.ch::before{content:'';position:absolute;inset:3px;border-radius:50%;background:radial-gradient(circle at 34% 24%,#fff8,transparent 52%);pointer-events:none}
.ch:not(:disabled):hover{transform:translateY(-4px) perspective(300px) rotateX(-14deg)}
.ch.on{transform:translateY(-9px) perspective(300px) rotateX(-18deg);box-shadow:0 0 16px #f6e27a,inset 0 0 0 3px var(--c),inset 0 5px 6px #fff4}
.ch:active{transform:translateY(1px)}
/* dice: beveled & tumbling in 3D */
.dice{background:linear-gradient(145deg,#fff,#fffdf5 50%,#e4dcc3);box-shadow:inset 0 0 0 1px #0002,inset 0 -5px 8px #0003,0 1px 0 #cfc7ae,0 2px 0 #b9b095,0 3px 0 #a39a80,0 9px 12px #000b}
@keyframes tm{0%{transform:perspective(500px) translate(-16px,0) rotate3d(1,1,0,0)}25%{transform:perspective(500px) translate(6px,-30px) rotate3d(1,1,0,110deg)}50%{transform:perspective(500px) translate(18px,2px) rotate3d(1,1,0,220deg)}75%{transform:perspective(500px) translate(-4px,-18px) rotate3d(1,1,0,290deg)}100%{transform:perspective(500px) translate(-16px,0) rotate3d(1,1,0,360deg)}}
@keyframes rl{from{transform:perspective(500px) translateY(-110px) rotate3d(1,1,0,200deg);opacity:0}}
/* sub-panels, bowl, wheel, slots */

<script>
const $=s=>document.querySelector(s),col={10:'#2b6cb0',50:'#c0242b',100:'#222',500:'#7a3aa8'},RED=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
const CAP=1e15;   /* 手持ちの上限：1000兆 */
const WK='cj_wallet';const ldW=()=>{try{const v=JSON.parse(localStorage.getItem(WK));if(v&&Number.isFinite(v.chips))return Math.min(CAP,Math.floor(v.chips))}catch(e){}return null};
const slotAlive=()=>{try{const v=JSON.parse(localStorage.getItem('cj_slot'));return!!v&&(v.cr>=3||!!v.free||!!v.betOn||!!(v.bonus&&v.bonus.left>0))}catch(e){return false}};
let chips=ldW()??1000,bet=50,bets={},rot=0,busy=0,seq=0,base=0,bj,ch,pk,yt;
const R=n=>{const a=new Uint32Array(1),m=Math.floor(2**32/n)*n;do crypto.getRandomValues(a);while(a[0]>=m);return a[0]%n};
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=R(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const deck=()=>shuf([...Array(52)].map((_,i)=>({r:i%13+2,s:Math.floor(i/13)})));
const L=r=>r<11?r:'JQKA'[r-11],cd=(c,h)=>{const n=!c.d;c.d=1;return`<div class="cd${n?' nw':''}${h?' bk':''}${c.s==1||c.s==2?' r':''}"${n?` style="animation-delay:${(c.o-base)*.3}s"`:''}>${L(c.r)}<b>${'♠♥♦♣'[c.s]}</b></div>`},dr=d=>{const c=d.pop();c.o=seq++;return c};
const dispW=()=>document.querySelectorAll('.bank').forEach(e=>e.textContent='🪙 '+chips.toLocaleString());
const saveW=()=>{try{localStorage.setItem(WK,JSON.stringify({chips:Math.min(CAP,Math.floor(chips)),t:Date.now(),src:'casino'}))}catch(e){}};
const upd=()=>{if(chips>CAP)chips=CAP;dispW();saveW()};
const broke=()=>chips<=0&&!slotAlive();
const syncW=()=>{const v=ldW();if(v!=null&&v!=chips){chips=v;dispW();if(!broke())$('#over').classList.remove('on');else showOver()}};
addEventListener('storage',e=>{if(e.key==WK)syncW()});addEventListener('pageshow',syncW);addEventListener('pagehide',saveW);document.addEventListener('visibilitychange',()=>document.hidden?saveW():syncW());
const st=h=>{$('#stage').innerHTML=h;base=seq;document.body.classList.remove('vl3f','sl3f');window.TB3&&TB3.sync();window.VL3&&VL3.sync();window.FV3&&FV3.sync();window.VS3&&VS3.sync();window.VC3&&VC3.sync();window.VR3&&VR3.sync();window.OL3&&OL3.sync();window.SV3&&SV3.sync()},msg=t=>$('#m').textContent=t,chk=()=>{upd();if(broke())showOver()};
const show=i=>document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id==i));
const STD=[10,50,100,500];
const moreHtml=()=>{const c=!STD.includes(bet);return`<button class="ch more${c?' on':''}" style="--c:#0f766e" onclick="moreOpen()" aria-label="好きな金額を賭ける">${c?`<small>more</small>${bet.toLocaleString()}`:'more'}</button>`};
const betRow=()=>`<div class="chips">${STD.map(v=>`<button class="ch${v==bet?' on':''}" style="--c:${col[v]}" onclick="setBet(${v})">${v}</button>`).join('')}${moreHtml()}</div><div class="chips" id="mrow" style="display:none"><input type="number" id="mb" inputmode="numeric" min="1" step="1" placeholder="賭け金" aria-label="賭け金" onkeydown="if(event.key=='Enter')moreSet()"><button class="btn s" onclick="moreSet()">決定</button></div>`;
function setBet(v){bet=v;const c=!STD.includes(bet);document.querySelectorAll('.ch').forEach(b=>{if(b.classList.contains('more')){b.classList.toggle('on',c);b.innerHTML=c?`<small>more</small>${bet.toLocaleString()}`:'more'}else b.classList.toggle('on',+b.textContent==bet)});if(betHook)betHook()}
function moreOpen(){const r=$('#mrow'),i=$('#mb');if(!r)return;const o=r.style.display=='none';r.style.display=o?'flex':'none';if(o){i.value=STD.includes(bet)?'':bet;i.focus()}}
function moreSet(){const i=$('#mb');if(!i)return;let n=Math.floor(+i.value);if(!(n>=1))return msg('1以上の数字を入力してください');if(chips<1)return msg('チップがありません');let t='';if(n>chips){n=chips;t=`所持チップ(${chips.toLocaleString()})が上限です。`}setBet(n);$('#mrow').style.display='none';msg(t+`ベット額 ${n.toLocaleString()}`)}
const G={bj:['ブラックジャック',()=>bjPre()],dh:['大富豪',()=>dhPre()],pk:['ポーカー',()=>{pkSes=null;pkPre()}],ch:['サイコロゲーム',()=>dcMenu()],ru:['ルーレット',()=>ruPre()],sl:['スロット',()=>slPre()],hr:['競馬',()=>hmMenu()],bc:['バカラ',()=>bcPre()],hl:['ハイ&ロー',()=>hlPre()],cr:['クラップス',()=>crPre()],sb:['シックボー',()=>sbPre()],vp:['VIPルーム',()=>vipMenu()],sv:['SVIPルーム',()=>svipMenu()]};
function play(k){window.TB3&&TB3.close();pkT++;betHook=null;show('s2');$('#gt').textContent=G[k][0];G[k][1]()}
function back(){if(JG&&(JG.ph=='spin'||JG.ph=='pull'))return;slHalt();pkT++;hrAbort();if(lv){const f=lv;lv=null;f()}ruClr();window.TB3&&TB3.close();show('s1')}
function bankAssets(){try{const b=JSON.parse(localStorage.getItem('cj_bank_v1'));if(!b)return 0;let a=Math.max(0,Number(b.dep)||0);(b.fixed||[]).forEach(f=>a+=Number(f.amt)||0);for(const k in(b.hold||{})){const q=Number(b.hold[k].q)||0,p=b.mk&&b.mk.s&&b.mk.s[k]?b.mk.s[k].p:0;a+=q*p}a+=Math.max(0,b.mg||0);return Math.floor(a)}catch(e){return 0}}
function showOver(){const a=bankAssets(),bt=$('#ovb');
const hd=chips<0?`手持ちが${chips.toLocaleString()}チップのマイナスです。`:'チップがなくなりました。';$('#ovp').textContent=a>=10?`${hd}銀行に約${a.toLocaleString()}チップの資産があります。出金するか、融資を受けて再挑戦しよう`:`${hd}${chips<0?'':'再入店はできません。'}銀行で融資を受けて再挑戦しよう`;
bt.textContent='🏦 銀行へ行く';bt.onclick=()=>{location.href='bank.html'};$('#over').classList.add('on')}
upd();if(broke())showOver();
/* 大富豪（通常ルーム）：CPU3人と対戦。賭け金は配牌時に引き落とし、順位で払い戻し（1位×2.5／2位×0.9／3位×0.4／4位×0）
   ルール：1〜4枚の同ランクの出し（ジョーカーはワイルド）／8切り／革命（4枚出し）／パスで場が流れる。階段・しばりは無し。 */
const DH_PAY=[2.5,.9,.4,0],DH_N=['あなた','CPU 太郎','CPU 花子','CPU 次郎'],DH_RK=['大富豪','富豪','貧民','大貧民'];
let dh=null;
const dhS=c=>c.j?16:c.r==14?14:c.r==2?15:c.r,dhEff=(S,rev)=>S>=16?99:rev?18-S:S;
const dhLab=c=>c.j?'JK':L(c.r),dhNm=c=>c.j?'ジョーカー':String(L(c.r));
function dhPre(){window.TB3&&TB3.open('dh');pkT++;dh=null;st(`<div class="msg" id="m">ベット額を選んでディール　CPU3人と対戦。上がった順位で払い戻し</div>${betRow()}<div class="lab">1位 ×2.5　／　2位 ×0.9　／　3位 ×0.4　／　4位 ×0<br>8切り・革命（4枚出し）あり。ジョーカー2枚はワイルド。途中で退出すると賭け金は戻りません</div><button class="btn" onclick="dhDeal()">ディール</button>`)}
function dhDeal(){if(bet>chips)return msg('チップが足りません');chips-=bet;upd();
  const d=shuf([...Array(52)].map((_,i)=>({r:i%13+2,s:Math.floor(i/13)})).concat([{j:1,s:4,r:0,id:0},{j:1,s:4,r:0,id:1}])),hand=[[],[],[],[]];d.forEach((c,i)=>hand[i%4].push(c));
  hand.forEach(h=>h.sort((a,b)=>dhS(a)-dhS(b)||a.s-b.s));
  let lead=hand.findIndex(h=>h.some(c=>!c.j&&c.r==3&&c.s==2));if(lead<0)lead=0;
  dh={hand,field:null,last:-1,pass:new Set(),turn:lead,rev:false,ranks:[],sel:new Set(),log:`${DH_N[lead]}（♦3）から始めます`,b:bet,over:false,t:++pkT};dhStep()}
const dhNext=p=>{for(let i=1;i<=4;i++){const q=(p+i)%4;if(!dh.ranks.includes(q))return q}return p};
function dhInfo(cs){if(!cs.length||cs.length>4)return null;const re=cs.filter(c=>!c.j);if(re.length&&new Set(re.map(c=>c.r)).size>1)return null;return{n:cs.length,S:re.length?dhS(re[0]):16,r:re.length?re[0].r:0}}
function dhOk(i){if(!i)return false;if(!dh.field)return true;return i.n==dh.field.n&&dhEff(i.S,dh.rev)>dhEff(dh.field.S,dh.rev)}
const dhDesc=cs=>cs.map(dhNm).join('・');
function dhApply(p,cs){const i=dhInfo(cs);cs.forEach(c=>{const k=dh.hand[p].indexOf(c);if(k>=0)dh.hand[p].splice(k,1)});
  dh.field={n:i.n,S:i.S,cards:cs};dh.last=p;dh.pass=new Set();let t=`${DH_N[p]}：${dhDesc(cs)}`,clear=false;
  if(i.r==8){clear=true;t+='　8切り！'}
  if(i.n>=4&&i.r){dh.rev=!dh.rev;t+=dh.rev?'　革命！（強弱が逆転）':'　革命返し！'}
  if(!dh.hand[p].length){dh.ranks.push(p);t+=`　上がり！（${DH_RK[dh.ranks.length-1]}）`}
  dh.log=t;
  if(dh.ranks.length>=3){const l=[0,1,2,3].find(x=>!dh.ranks.includes(x));dh.ranks.push(l);dh.over=true;return}
  if(clear){dh.field=null;dh.pass=new Set();dh.turn=dh.ranks.includes(p)?dhNext(p):p}else dh.turn=dhNext(p)}
function dhDoPass(p){dh.pass.add(p);dh.log=`${DH_N[p]}：パス`;
  const act=[0,1,2,3].filter(x=>!dh.ranks.includes(x)&&x!=dh.last);
  if(act.every(x=>dh.pass.has(x))){dh.field=null;dh.pass=new Set();dh.turn=dh.ranks.includes(dh.last)?dhNext(dh.last):dh.last;dh.log+='　場が流れました'}
  else dh.turn=dhNext(p)}
function dhAI(p){const h=dh.hand[p],js=h.filter(c=>c.j),g={};h.filter(c=>!c.j).forEach(c=>(g[c.r]=g[c.r]||[]).push(c));
  const gs=Object.values(g).sort((a,b)=>dhEff(dhS(a[0]),dh.rev)-dhEff(dhS(b[0]),dh.rev)),f=dh.field;
  if(!f){if(gs.length)return gs[0];return js.slice(0,Math.min(2,js.length))}
  const opts=[];for(const x of gs){const e=dhEff(dhS(x[0]),dh.rev);if(e<=dhEff(f.S,dh.rev))continue;
    if(x.length>=f.n)opts.push(x.slice(0,f.n));else if(h.length<=5&&js.length&&x.length+js.length>=f.n)opts.push(x.concat(js).slice(0,f.n))}
  if(opts.length){const o=opts[0];if(dhEff(dhS(o.find(c=>!c.j)||o[0]),dh.rev)>=14&&h.length>5&&R(10)<4)return null;return o}
  if(f.n==1&&js.length&&(h.length<=3||(dhEff(f.S,dh.rev)>=14&&R(10)<4)))return[js[0]];
  return null}
async function dhStep(){const t=dh.t;
  for(;;){if(t!=pkT)return;dhR();if(dh.over)return dhEnd();
    if(dh.turn==0&&!dh.ranks.includes(0))return;
    await new Promise(r=>setTimeout(r,dh.ranks.includes(0)?260:760));if(t!=pkT)return;
    const p=dh.turn,a=dhAI(p);if(a&&dhOk(dhInfo(a)))dhApply(p,a);else dhDoPass(p)}}
function dhTog(i){if(!dh||dh.turn!=0||dh.over)return;dh.sel.has(i)?dh.sel.delete(i):dh.sel.add(i);dhR()}
function dhGo(){if(!dh||dh.turn!=0||dh.over)return;const cs=[...dh.sel].sort((a,b)=>a-b).map(i=>dh.hand[0][i]);
  if(!cs.length)return msg('出すカードを選んでください');const i=dhInfo(cs);
  if(!i)return msg('同じ数字のカードだけ出せます（ジョーカーはワイルド）');
  if(!dhOk(i))return msg(dh.field?`場は${dh.field.n}枚。${dh.field.n}枚で、より強いカードを出してください`:'そのカードは出せません');
  dh.sel=new Set();dhApply(0,cs);dhStep()}
function dhPassBtn(){if(!dh||dh.turn!=0||dh.over)return;if(!dh.field)return msg('先手はパスできません');dh.sel=new Set();dhDoPass(0);dhStep()}
function dhCard(c,i,sel){const r=c.s==1||c.s==2||(c.j&&c.id==1);return`<div class="cd${r?' r':''}${c.j?' jk':''}${sel?' sel':''}" data-k="${c.j?'J'+c.id:c.r+'_'+c.s}"${i>=0?` onclick="dhTog(${i})"`:''}>${dhLab(c)}<b>${c.j?'★':'♠♥♦♣'[c.s]}</b></div>`}
function dhR(){const me=dh.turn==0&&!dh.over&&!dh.ranks.includes(0);
  const seat=p=>{const o=dh.ranks.indexOf(p);return`<div class="hand${dh.turn==p&&!dh.over?' w':''}" style="min-width:92px;padding:6px 8px"><div class="lab" style="margin:0">${DH_N[p]}</div><div style="font-size:18px">🂠 ×${dh.hand[p].length}</div><div class="lab" style="margin:0">${o>=0?`🏁 ${DH_RK[o]}`:dh.turn==p&&!dh.over?'考え中…':dh.pass.has(p)?'パス':''}</div></div>`};
  st(`<div class="row" style="min-height:0;gap:8px">${[1,2,3].map(seat).join('')}</div>${[1,2,3].map(p=>`<div class="row dhx" data-z="s${p}">${'<div class="cd bk"></div>'.repeat(dh.hand[p].length)}</div>`).join('')}
<div class="lab">${dh.rev?'🔄 革命中（弱いカードが強い）':'場'}　／　賭け ${dh.b.toLocaleString()}</div>
<div class="row stk" data-z="f" data-from="s${dh.last}" style="min-height:84px">${dh.field?dh.field.cards.map(c=>dhCard(c,-1,0)).join(''):'<span class="lab">（場は空です。好きなカードで先手）</span>'}</div>
<div class="msg" id="m">${dh.log}</div>
<div class="lab">あなた${dh.ranks.includes(0)?`　🏁 ${DH_RK[dh.ranks.indexOf(0)]}`:''}（${dh.hand[0].length}枚）</div>

const HID=(()=>{try{let v=localStorage.getItem('cj_horse_id');if(!/^[0-9a-f]{16}$/.test(v||'')){v=Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>b.toString(16).padStart(2,'0')).join('');localStorage.setItem('cj_horse_id',v)}return v}catch(e){return'0000000000000000'}})();
const hmRpc=(fn,a,ms)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||2500);return fetch(SUPA.url+'/rest/v1/rpc/'+fn,{method:'POST',signal:c.signal,headers:{'Content-Type':'application/json',apikey:SUPA.key,Authorization:'Bearer '+SUPA.key},body:JSON.stringify(a)}).finally(()=>clearTimeout(t))};
let hmRegT=0;
function hmReg(){if(!HM)return;clearTimeout(hmRegT);hmRegT=setTimeout(()=>{try{hmRpc('horse_upsert',{p_id:HID,p_name:HM.name,p_spd:HM.spd,p_sta:HM.sta,p_gut:HM.gut,p_fat:HM.fat,p_races:HM.races,p_wins:HM.wins}).catch(()=>{})}catch(e){}},400)}
async function hmPubGet(){try{const r=await hmRpc('horse_pick',{p_exclude:HID,p_n:7});if(!r.ok)return[];const a=await r.json(),cl=x=>Math.max(1,Math.min(1e9,Math.floor(+x)||1)),seen=new Set(HM?[HM.name]:[]),o=[];
for(const v of Array.isArray(a)?a:[]){if(!v||!HKANA.test(v.name)||seen.has(v.name))continue;seen.add(v.name);o.push({n:'👤'+v.name,spd:cl(v.spd),sta:cl(v.sta),gut:cl(v.gut),cond:1-Math.max(0,(+v.fat||0)-30)*.001+(R(31)-15)/1000,own:0,net:1});if(o.length>=7)break}return o}catch(e){return[]}}
const gz=()=>Math.sqrt(-2*Math.log((R(999999)+1)/1e6))*Math.cos(2*Math.PI*R(1000000)/1e6);
const hmCL=c=>c>=1.02?'🔥絶好調':c>=1.008?'🙂好調':c<=.98?'😣不調':c<=.992?'😟やや不調':'😐普通';
const hmInfo=x=>`速${x.spd} 持${x.sta} 根${x.gut} ・${HSTK[x.stl+1]} ・${hmCL(x.cond)}`;
// コース上の位置：s＝中心線に沿った距離、off＝レーン（外側が＋）。反時計回り
function hmXY(s,off){s=((s%TL)+TL)%TL;const{sl,r,x1,x2,y}=TK,pr=Math.PI*r;
if(s<sl)return[x1+s,y+r+off];s-=sl;
if(s<pr){const a=Math.PI/2-s/r,q=r+off;return[x2+q*Math.cos(a),y+q*Math.sin(a)]}s-=pr;
if(s<sl)return[x2-s,y-r-off];s-=sl;
const a=-Math.PI/2-s/r,q=r+off;return[x1+q*Math.cos(a),y+q*Math.sin(a)]}
// 出走表（自馬を出すなら1頭は自馬）。「みんな」の評価(pub)は能力と調子を見て、少しズレる
function hmNew(own,no,net){const lvl=48+R(13),g=()=>Math.max(15,Math.min(95,Math.round(lvl+gz()*13)));
net=(net||[]).slice(0,own?7:8);const nn=new Set(net.map(x=>x.n.slice(2)));
const names=shuf(HPOOL.filter(x=>(!HM||x!=HM.name)&&!nn.has(x))).slice(0,(own?7:8)-net.length);
let f=shuf(names.map(n=>({n,spd:g(),sta:g(),gut:g(),cond:1+(R(61)-30)/1000,own:0})).concat(net));
if(own)f.splice(R(f.length+1),0,{n:HM.name,spd:HM.spd,sta:HM.sta,gut:HM.gut,cond:1-Math.max(0,HM.fat-30)*.001+(R(31)-15)/1000,own:1});
f.forEach(x=>{x.stl=R(3)-1;x.pub=.117*(x.spd-50)+.056*(x.sta-50)+.013*(x.gut-50)+(x.cond-1)*100+gz()*.8});
const wg=f.map(x=>Math.exp(x.pub/TAU)),pw=wg.map(v=>Math.pow(v,KAP)),W=wg.reduce((a,b)=>a+b,0),WP=pw.reduce((a,b)=>a+b,0),nz=()=>Math.exp(gz()*.15),pool={w:{},p:{},q:{},wd:{}},pr=[];
let PW=0,PP=0;for(let i=0;i<8;i++)for(let j=i+1;j<8;j++){pr.push([i,j,wg[i]*wg[j],pw[i]*pw[j]]);PW+=wg[i]*wg[j];PP+=pw[i]*pw[j]}
// 開始時点で「みんな」がすでに買っている分（人気に比例＋少しバラつき）。受付中にさらに増えていく
for(let i=0;i<8;i++){pool.w[i]=Math.max(10,Math.round(HBASE.w*wg[i]/W*nz()));pool.p[i]=Math.max(10,Math.round(HBASE.p*pw[i]/WP*nz()))}
pr.forEach(([i,j,v,u])=>{pool.q[i+'-'+j]=Math.max(10,Math.round(HBASE.q*v/PW*nz()));pool.wd[i+'-'+j]=Math.max(10,Math.round(HBASE.wd*u/PP*nz()))});
const h={no,own:own?1:0,f,wg,pw,pool,mine:{},tab:'w',ph:'bet',iv:0,end:0,res:null};hm=h;return h}
const hmPT=t=>Object.values(hm.pool[t]).reduce((a,b)=>a+b,0);
// オッズ＝その券種の総額×(1−控除率)÷的中票の額（複勝・ワイドは的中3通りで等分）。最低1.0倍（元返し）
function hmO(t,k){const v=hm.pool[t][k];if(!(v>0))return 0;const o=hmPT(t)*(1-HTAKE)/(t=='p'||t=='wd'?3:1)/v;return o>=100?Math.floor(o):Math.floor(Math.max(1,o)*10)/10}
const hmF=o=>o?(o>=1000?'999+':o>=100?String(o):o.toFixed(1)):'—';
// レース展開：0.1秒刻みでシミュレーション（脚質・スタミナ切れ・ラストスパート・ゆらぎ）。着順はこの結果で決まる
function hmSim(f){const N=f.length,dt=.1,pos=f.map(()=>[0]),p=f.map(()=>0),nz=f.map(()=>0),fin=f.map(()=>0),dn=f.map(()=>0),df=f.map(()=>gz()*.015);
const vb=f.map((x,i)=>(x.cond+df[i])/31*(.94+.12*x.spd/100));
let k=0,left=N;
while(left&&k<1000){k++;const t=k*dt;
for(let i=0;i<N;i++){if(dn[i]){pos[i].push(1);continue}const x=f[i],q=p[i];
nz[i]+=-nz[i]*.8*dt+.04*Math.sqrt(dt)*gz();
const ps=Math.min(.99,.4+.5*x.sta/100),fd=Math.max(0,(q-ps)/(1-ps)),fm=1-.2*fd,gm=1+.1*(x.gut/100)*Math.max(0,Math.min(1,(q-.75)/.25)),sm=1+.035*x.stl*(.5-q)*2;
const np=q+vb[i]*fm*gm*sm*(1+nz[i])*dt;
if(np>=1){fin[i]=t-dt+dt*(1-q)/(np-q);dn[i]=1;left--;p[i]=1;pos[i].push(1)}else{p[i]=np;pos[i].push(np)}}}
f.forEach((_,i)=>{if(!dn[i])fin[i]=99+p[i]*-1});
return{pos,fin,order:[...f.keys()].sort((a,b)=>fin[a]-fin[b])}}
const hmPr=(s,t)=>s.pos.map(a=>{const k=Math.max(0,t)/.1,i=Math.min(a.length-1,Math.floor(k)),j=Math.min(a.length-1,i+1),u=Math.min(1,k-i);return a[i]+(a[j]-a[i])*u});
const hmOrd=(pr,fin)=>[...pr.keys()].sort((a,b)=>pr[b]-pr[a]||(pr[a]>=1?fin[a]-fin[b]:a-b));

/* ===== VIPオンライン対戦（Supabase Realtime／ホスト進行型）：ロシアンルーレット・ポーカー =====
   通信料：1プレイ（ルーレット1試合／ポーカー1ハンド）ごとに、稼いだチップの1％を徴収 */
const OFEE=.01,oFee=p=>p>0?Math.floor(p*OFEE):0;
/*ENGINE*/
// ---- テキサスホールデム（最大6人）の進行ロジック。ホストの画面だけが持つ ----
function hNew(bb){return{bb,ps:[],dl:-1,bd:[],ph:0,cur:-1,tb:0,mr:bb,hn:0,st:'wait',res:null,dd:0}}
const hAdd=(G,id,nm,stk)=>G.ps.push({id,nm,stk,bet:0,tot:0,fold:1,ai:0,ac:0,hole:[],in:0,s0:stk,seen:0,miss:0,lv:0});
const hNx=(G,i,f)=>{const n=G.ps.length;for(let k=1;k<=n;k++){const j=((i+k)%n+n)%n;if(f(G.ps[j]))return j}return -1};
const hPost=(p,a)=>{const x=Math.min(a,p.stk);p.stk-=x;p.bet+=x;p.tot+=x;if(!p.stk)p.ai=1};
function hClean(G){const did=G.ps[G.dl]&&G.ps[G.dl].id,out=G.ps.filter(p=>p.lv||p.stk<=0);G.ps=G.ps.filter(p=>!p.lv&&p.stk>0);G.dl=G.ps.findIndex(p=>p.id==did);return out}
function hDeal(G){const P=G.ps;if(P.length<2){G.st='wait';return}
  G.hn++;G.st='play';G.bd=[];G.ph=0;G.res=null;G.d=deck();
  P.forEach(p=>{p.in=1;p.bet=p.tot=0;p.fold=0;p.ai=0;p.ac=0;p.s0=p.stk;p.hole=[G.d.pop(),G.d.pop()]});
  const d=hNx(G,G.dl,()=>1),sb=P.length==2?d:hNx(G,d,()=>1),bb=hNx(G,sb,()=>1);G.dl=d;
  hPost(P[sb],Math.floor(G.bb/2));hPost(P[bb],G.bb);G.tb=Math.max(...P.map(p=>p.bet));G.mr=G.bb;hStep(G,bb)}
function hStep(G,i){const P=G.ps;if(P.filter(p=>!p.fold).length<2)return hEnd(G);
  for(;;){const can=P.filter(p=>!p.fold&&!p.ai);
    const done=can.every(p=>p.ac&&p.bet==G.tb)||(can.length<2&&can.every(p=>p.bet>=G.tb));
    if(!done){G.cur=hNx(G,i,p=>!p.fold&&!p.ai);return}
    if(G.ph==3)return hEnd(G);
    P.forEach(p=>{p.bet=0;p.ac=0});G.tb=0;G.mr=G.bb;G.ph++;
    G.bd.push(...(G.ph==1?[G.d.pop(),G.d.pop(),G.d.pop()]:[G.d.pop()]));i=G.dl}}
function hAct(G,i,a,x){const p=G.ps[i];if(!p||G.cur!=i||G.st!='play')return 0;const need=G.tb-p.bet;
  if(a=='f')p.fold=1;
  else if(a=='k'){if(need>0)return 0}
  else if(a=='c'){const y=Math.min(need,p.stk);p.stk-=y;p.bet+=y;p.tot+=y;if(!p.stk)p.ai=1}
  else if(a=='r'){x=Math.floor(+x);const mx=p.bet+p.stk;if(!(x>G.tb)||mx<=G.tb)return 0;x=Math.min(x,mx);
    if(x<G.tb+G.mr&&x<mx)return 0;
    const y=x-p.bet;p.stk-=y;p.bet=x;p.tot+=y;if(!p.stk)p.ai=1;
    if(x-G.tb>=G.mr)G.mr=x-G.tb;G.tb=x;G.ps.forEach((q,j)=>{if(j!=i)q.ac=0})}
  else return 0;
  p.ac=1;hStep(G,i);return 1}
function hEnd(G){const P=G.ps,live=P.map((p,i)=>p.fold?-1:i).filter(i=>i>=0),W=P.map(()=>0),sd=live.length>1;
  if(sd)live.forEach(i=>P[i].sc=best([...P[i].hole,...G.bd]));
  const lvl=[...new Set(P.map(p=>p.tot).filter(x=>x>0))].sort((a,b)=>a-b);let pv=0;
  for(const T of lvl){const amt=(T-pv)*P.filter(p=>p.tot>=T).length;pv=T;
    let el=live.filter(i=>P[i].tot>=T);
    if(!el.length){const m=Math.max(...live.map(i=>P[i].tot));el=live.filter(i=>P[i].tot==m)}
    let w=el;if(sd){let b=null;w=[];el.forEach(i=>{const c=b?cmp(P[i].sc,b):1;if(c>0){b=P[i].sc;w=[i]}else if(c==0)w.push(i)})}
    const q=Math.floor(amt/w.length);w.forEach(i=>W[i]+=q);W[w[0]]+=amt-q*w.length}
  const fee=P.map(()=>0);
  P.forEach((p,i)=>{p.stk+=W[i];const f=G.nf?0:oFee(p.stk-p.s0);if(f>0){p.stk-=f;fee[i]=f}});   // 通信料：このハンドで稼いだ分の1％
  G.res={w:W,fee,ns:P.map(p=>p.stk-p.s0),rev:sd?live.map(i=>({i,h:P[i].hole,n:HN[P[i].sc[0]]})):[]};
  G.st='end';G.cur=-1;P.forEach(p=>{p.bet=0})}
const hView=G=>({hn:G.hn,bb:G.bb,dl:G.dl,cur:G.cur,bd:G.bd,ph:G.ph,tb:G.tb,mr:G.mr,st:G.st,ms:Math.max(0,G.dd-Date.now()),pot:G.ps.reduce((a,p)=>a+p.tot,0),res:G.res,
  ps:G.ps.map(p=>({id:p.id,nm:p.nm,stk:p.stk,bet:p.bet,tot:p.tot,fold:p.fold,ai:p.ai,in:p.in}))});
/*ENDENGINE*/

function ccSync(twice){const o=ol;if(!o||!o.host||o.g!='cc')return;o.G.q++;const V=o.V=ccView(o.G);o.dl=Date.now()+V.ms;oSend(o.c,'cs',V);if(twice)setTimeout(()=>{if(ol==o)oSend(o.c,'cs',V)},900);ccGo(V)}

function ccTurn(){const o=ol,G=o.G;clearTimeout(o.tm);if(G.st!='play'){G.dd=0;return}const p=G.ps[G.cur],t=p&&p.lv?500:p&&p.auto?1300:25000,rn=G.rn,cur=G.cur;G.dd=Date.now()+t;o.tm=setTimeout(()=>ccAuto(rn,cur),t)}
function ccAuto(rn,cur){const o=ol;if(!o||!o.host||o.g!='cc'||o.G.rn!=rn||o.G.cur!=cur||o.G.st!='play')return;const p=o.G.ps[cur];if(p.lv){p.done=1;p.y=null;return ccNext(cur)}p.auto=1;ccDo(cur)}
function ccDo(i){const o=ol,G=o.G;if(G.st!='play'||G.cur!=i)return 0;const p=G.ps[i],d=r3(),y=yk(d);p.d=d;p.n++;p.ry=y;G.last={i,k:++G.rq};

function ccNext(i){const o=ol,G=o.G;let j=i+1;while(j<G.ps.length&&G.ps[j].lv){G.ps[j].done=1;G.ps[j].y=null;j++}

// 精算：子ごとに親と勝負（倍率は通常のチンチロと同じ）。親の払いは親の手持ち＋子の負け分まで
function ccSettle(){const o=ol,G=o.G;clearTimeout(o.tm);G.dd=0;const b=G.b,c=G.ps[0].y,cr={},r=[],w=[];let lossT=0,gain=0;
  G.ps.forEach((p,i)=>{if(!i)return;if(p.lv||!p.y){cr[p.id]=0;r.push({i,k:'f',amt:b});lossT+=b;return}const y=p.y;
    if(y.v>c.v){const m=Math.max(y.m,1)*(c.m<0?2:1);w.push({p,i,g:b*m});gain+=b*m}
    else if(y.v<c.v){const m=Math.max(c.m,1)*(y.m<0?2:1),x=Math.min(Math.max(0,(p.c||0)-b),b*(m-1));cr[p.id]=-x;r.push({i,k:'l',amt:b+x});lossT+=b+x}

   const tx=Math.cos(ang)*R2,tz=-7+Math.sin(ang)*R2*.62,ty=1.2+Math.sin(ang*2)*.9+Math.min(2.2,Math.log(Math.max(m,1))*.5);
   orb.position.x+=(tx-orb.position.x)*Math.min(1,dt*7);orb.position.y+=(ty-orb.position.y)*Math.min(1,dt*7);orb.position.z+=(tz-orb.position.z)*Math.min(1,dt*7);
   orb.scale.setScalar(1);oGlow.material.opacity=.9;oLight.intensity=1.2}
  burst.forEach(b=>{if(b.l<=0)return;b.l-=dt;if(b.l<=0){b.s.visible=false;return}b.v.y-=9*dt;b.s.position.addScaledVector(b.v,dt);b.s.scale.setScalar(1.4*b.l+.3);b.s.material.opacity=b.l});
  pl.intensity=1.4+Math.sin(t*9)*.3;
  cam.position.set(Math.sin(t*.3)*1.4,5.4,15.5);cam.lookAt(0,2.2,-5);
  R.render(sc,cam)}
 me.raf=requestAnimationFrame(frame)}
/* ================= diamond mines ================= */
function buildMines(stg){
 const host=document.createElement('div');host.className='sv3mn';stg.insertBefore(host,stg.firstChild);stg.classList.add('sv3mon');
 const cv=document.createElement('canvas');cv.style.cssText='width:100%;height:100%;display:block';host.appendChild(cv);
 const R=mkRenderer(host,cv),sc=baseScene(0x0a0614,.012),cam=new T.PerspectiveCamera(46,1,.1,200);
 const M=(c,o)=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:.6,metalness:.15},o||{}));
 const A=(g,m,x,y,z,p)=>{const o=new T.Mesh(g,m);o.position.set(x,y,z);(p||sc).add(o);return o};
 sc.add(new T.AmbientLight(0x7a86b8,.9));
 const dl=new T.DirectionalLight(0xeaf2ff,.9);dl.position.set(-10,18,8);sc.add(dl);
 const hl=new T.PointLight(0xff4a1a,1,40);hl.position.set(14,6,4);sc.add(hl);

 const floor=A(new T.PlaneGeometry(60,60),M(0x0d0a18,{roughness:.95}),0,-.6,0);floor.rotation.x=-PI/2;
 const texClosed=cvs(128,128,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#3a5a94');gr.addColorStop(1,'#16264f');g.fillStyle=gr;g.fillRect(0,0,w,h);g.strokeStyle='#ffe9a0';g.lineWidth=6;g.strokeRect(5,5,w-10,h-10);g.fillStyle='#fff';g.font='900 62px '+JP;g.textAlign='center';g.textBaseline='middle';g.fillText('？',w/2,h/2+4)});
 const texOk=cvs(128,128,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#fff6c8');gr.addColorStop(1,'#e8c060');g.fillStyle=gr;g.fillRect(0,0,w,h);g.font='84px serif';g.textAlign='center';g.textBaseline='middle';g.fillText('😇',w/2,h/2+6)});
 const texBomb=cvs(128,128,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#9a1208');gr.addColorStop(1,'#2a0404');g.fillStyle=gr;g.fillRect(0,0,w,h);g.font='84px serif';g.textAlign='center';g.textBaseline='middle';g.fillText('👹',w/2,h/2+6)});
 const sideM=M(0x1c2a4d,{roughness:.5,metalness:.3});
 const tiles=[];
 for(let i=0;i<25;i++){const top=new T.MeshStandardMaterial({map:texClosed,roughness:.45,metalness:.15});
  const mesh=new T.Mesh(JX.rbox(1,.08),[sideM,sideM,top,M(0x141c33),sideM,sideM]);
  mesh.scale.set(3,.8,3);mesh.position.set((i%5-2)*3.4,0,(Math.floor(i/5)-2)*3.4);sc.add(mesh);
  tiles.push({mesh,top,state:'closed',el:null,revT:-9,ph:Math.random()*TAU})}
 function syncTiles(){const els=[...stg.querySelectorAll('.svt')];tiles.forEach((tl,i)=>{const el=els[i];tl.el=el||null;if(!el)return;
   const st2=el.classList.contains('ok')?'ok':el.classList.contains('bomb')?'bomb':'closed';
   if(st2!==tl.state){tl.state=st2;tl.top.map=st2==='ok'?texOk:st2==='bomb'?texBomb:texClosed;tl.top.needsUpdate=true;if(st2!=='closed')tl.revT=t}})}
 function fit(){const w=host.clientWidth||430,h=host.clientHeight||360;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
 const me={kind:'mines',host,dead:false,raf:0,ro:null,dispose:null,syncTiles,
  rehost(stg2){if(!host.isConnected){host.remove();stg2.insertBefore(host,stg2.firstChild)}stg2.classList.add('sv3mon');fit()}};
 me.ro=typeof ResizeObserver!='undefined'?new ResizeObserver(fit):null;me.ro&&me.ro.observe(host);fit();
 me.dispose=stdDispose(me,R,host,()=>{host.remove();const s=document.getElementById('stage');s&&s.classList.remove('sv3mon')});S=me;
 const ray=new T.Raycaster(),mv=new T.Vector2();
 cv.addEventListener('click',ev=>{const r=cv.getBoundingClientRect();mv.set((ev.clientX-r.left)/r.width*2-1,-((ev.clientY-r.top)/r.height)*2+1);ray.setFromCamera(mv,cam);const hs=ray.intersectObjects(tiles.map(tl=>tl.mesh),false);if(!hs.length)return;const tl=tiles.find(q=>q.mesh===hs[0].object);if(tl&&tl.el&&!tl.el.disabled)tl.el.click()});
 let t=0,last=performance.now();
 syncTiles();
 function frame(ts){me.raf=requestAnimationFrame(frame);if(me.dead)return;if(!cv.isConnected){me.dispose();return}if(document.hidden||!host.offsetParent){last=ts;return}
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;t+=dt;
  tiles.forEach((tl,i)=>{const open=tl.state!=='closed',ru=clamp((t-tl.revT)/.45,0,1);
   tl.mesh.position.y=(open?.55*ease(ru):Math.sin(t*1.6+tl.ph)*.09);
   tl.mesh.rotation.y=open?ease(ru)*.0:0;
   if(tl.state==='bomb'&&ru<1)tl.mesh.position.x=(i%5-2)*3.4+Math.sin(t*70)*0.09*(1-ru);
   tl.mesh.rotation.x=open?-ease(ru)*.16:0});
  hl.intensity=.9+Math.sin(t*6.7)*.2;
  cam.position.set(Math.sin(t*.3)*1.2,19,13.8);cam.lookAt(0,-.4,.4);

 me.raf=requestAnimationFrame(frame)}
/* ================= platinum roulette ================= */
function buildWheel(stg,wrap){
 const host=document.createElement('div');host.className='sv3wh';wrap.appendChild(host);wrap.classList.add('sv3w');
 const cv=document.createElement('canvas');cv.style.cssText='width:100%;height:100%;display:block';host.appendChild(cv);
 const R=mkRenderer(host,cv),sc=baseScene(0x07040c,.012),cam=new T.PerspectiveCamera(46,1,.1,220);
 const M=(c,o)=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:.55,metalness:.2},o||{}));
 const A=(g,m,x,y,z,p)=>{const o=new T.Mesh(g,m);o.position.set(x,y,z);(p||sc).add(o);return o};
 sc.add(new T.AmbientLight(0x8a90b8,.85));
 const dl=new T.DirectionalLight(0xfff2d8,1);dl.position.set(-8,20,10);sc.add(dl);
 const gp=new T.PointLight(0xffc060,1,50);gp.position.set(0,10,6);sc.add(gp);
 A(new T.CylinderGeometry(11.4,12,1,48),M(0x141824,{roughness:.5,metalness:.4}),0,-1.4,0);
 const trim=A(new T.TorusGeometry(11.5,.22,8,64),M(0xd4af37,{metalness:.9,roughness:.3}),0,-.85,0);trim.rotation.x=PI/2;
 const ORD=(typeof ORDER!=='undefined'&&Array.isArray(ORDER))?ORDER:[...Array(37).keys()];
 const REDA=(typeof RED!=='undefined'&&Array.isArray(RED))?RED:[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
 const wheelTex=cvs(1024,1024,(g,w,h)=>{const c=w/2,n=ORD.length,st=TAU/n;
  for(let i=0;i<n;i++){const a0=i*st,a1=a0+st,num=ORD[i];g.beginPath();g.moveTo(c,c);g.arc(c,c,c-6,a0,a1);g.closePath();g.fillStyle=num==0?'#0d6b42':REDA.includes(num)?'#c01828':'#14161c';g.fill();g.strokeStyle='#c8ccd8';g.lineWidth=3;g.stroke();
   g.save();g.translate(c,c);g.rotate(a0+st/2);g.fillStyle='#fff';g.font='700 44px Georgia,serif';g.textAlign='center';g.textBaseline='middle';g.fillText(String(num),c*.83,0);g.restore()}
  const gr=g.createRadialGradient(c,c,10,c,c,c*.6);gr.addColorStop(0,'#f4f6fb');gr.addColorStop(.7,'#aab2c4');gr.addColorStop(1,'#6a7284');g.beginPath();g.arc(c,c,c*.6,0,7);g.fillStyle=gr;g.fill();g.strokeStyle='#d4af37';g.lineWidth=8;g.stroke();
  g.fillStyle='#3a4152';g.font='900 64px '+JP;g.textAlign='center';g.textBaseline='middle';g.fillText('SVIP',c,c)});
 const wheel=new T.Group();sc.add(wheel);
 const side=M(0x8a93a8,{metalness:.85,roughness:.3}),top=new T.MeshStandardMaterial({map:wheelTex,roughness:.35,metalness:.25});
 const disc=new T.Mesh(new T.CylinderGeometry(7.7,7.7,1.1,48),[side,top,side]);wheel.add(disc);
 const rim=A(new T.TorusGeometry(7.75,.34,10,56),M(0xd4af37,{metalness:.9,roughness:.25}),0,.4,0,wheel);rim.rotation.x=PI/2;
 A(new T.ConeGeometry(1.1,1.6,20),M(0xd4af37,{metalness:.9,roughness:.25}),0,1.2,0,wheel);
 const marker=A(new T.ConeGeometry(.62,1.5,4),new T.MeshStandardMaterial({color:0xffd76a,emissive:0xa87a10,emissiveIntensity:.8,metalness:.7,roughness:.3}),0,2,-8.9);marker.rotation.x=PI;
 const ball=A(new T.SphereGeometry(.52,16,12),new T.MeshStandardMaterial({color:0xffffff,roughness:.15,metalness:.4,emissive:0x444444}),0,1,-7.5);
 function fit(){const w=host.clientWidth||440,h=host.clientHeight||340;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
 const me={kind:'wheel',host,dead:false,raf:0,ro:null,dispose:null,
  rehost(stg2,w2){if(!w2)return;w2.classList.add('sv3w');if(host.parentElement!==w2)w2.appendChild(host);fit()}};
 me.ro=typeof ResizeObserver!='undefined'?new ResizeObserver(fit):null;me.ro&&me.ro.observe(host);fit();
 me.dispose=stdDispose(me,R,host,()=>{host.remove();document.querySelectorAll('.wrap.sv3w').forEach(x=>x.classList.remove('sv3w'))});S=me;
 let t=0,last=performance.now(),cur=0,from=0,to=0,t0=-9,ballA=-PI/2,flash=0,lastRn='?';
 function targetDeg(){const wEl=document.getElementById('wh');if(!wEl)return to;const mm=/rotate\((-?[0-9.]+)deg\)/.exec(wEl.style.transform||'');return mm?parseFloat(mm[1]):to}
 function frame(ts){me.raf=requestAnimationFrame(frame);if(me.dead)return;if(!cv.isConnected){me.dispose();return}if(document.hidden||!host.offsetParent){last=ts;return}
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;t+=dt;
  const tg=targetDeg();if(tg!==to){from=cur;to=tg;t0=t}
  const u=clamp((t-t0)/4,0,1),e=1-Math.pow(1-u,5);cur=lerp(from,to,e);
  wheel.rotation.y=cur*PI/180;
  const rn=document.getElementById('rn'),rnt=rn?rn.textContent.trim():'?';
  if(rnt!==lastRn){if(rnt!=='?')flash=1;lastRn=rnt}
  flash=Math.max(0,flash-dt*1.4);gp.intensity=1+flash*2.4;
  if(u<1){const be=1-Math.pow(1-u,3);ballA=-PI/2-(1-be)*TAU*3;const br=lerp(9.3,7.5,e),by=lerp(2.6,1.05,e);
   ball.position.set(Math.cos(ballA)*br,by,Math.sin(ballA)*br)}
  else ball.position.set(Math.cos(-PI/2)*7.5,1.05,Math.sin(-PI/2)*7.5);
  ball.material.emissiveIntensity=flash*2;
  cam.position.set(Math.sin(t*.3)*1.3,17.5,19.5);cam.lookAt(0,-.2,-.5);
  R.render(sc,cam)}
 me.raf=requestAnimationFrame(frame)}
return{sync}})();
