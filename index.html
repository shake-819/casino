function hmXY(s,off){s=((s%TL)+TL)%TL;const{sl,r,x1,x2,y}=TK,pr=Math.PI*r;
if(s<sl)return[x1+s,y+r+off];s-=sl;

function hmNew(own,no,net){const lvl=48+R(13),g=()=>Math.max(15,Math.min(95,Math.round(lvl+gz()*13)));
net=(net||[]).slice(0,own?7:8);const nn=new Set(net.map(x=>x.n.slice(2)));
const names=shuf(HPOOL.filter(x=>(!HM||x!=HM.name)&&!nn.has(x))).slice(0,(own?7:8)-net.length);
let f=shuf(names.map(n=>({n,spd:g(),sta:g(),gut:g(),cond:1+(R(61)-30)/1000,own:0})).concat(net));
if(own)f.splice(R(f.length+1),0,{n:HM.name,spd:HM.spd,sta:HM.sta,gut:HM.gut,cond:1-Math.max(0,HM.fat-30)*.001+(R(31)-15)/1000,own:1});
f.forEach(x=>{x.stl=R(3)-1;x.pub=.117*(x.spd-50)+.056*(x.sta-50)+.013*(x.gut-50)+(x.cond-1)*100+gz()*.8});
const wg=f.map(x=>Math.exp(x.pub/TAU)),pw=wg.map(v=>Math.pow(v,KAP)),W=wg.reduce((a,b)=>a+b,0),WP=pw.reduce((a,b)=>a+b,0),nz=()=>Math.exp(gz()*.15),pool={w:{},p:{},q:{},wd:{}},pr=[];
let PW=0,PP=0;for(let i=0;i<8;i++)for(let j=i+1;j<8;j++){pr.push([i,j,wg[i]*wg[j],pw[i]*pw[j]]);PW+=wg[i]*wg[j];PP+=pw[i]*pw[j]}

function hmO(t,k){const v=hm.pool[t][k];if(!(v>0))return 0;const o=hmPT(t)*(1-HTAKE)/(t=='p'||t=='wd'?3:1)/v;return o>=100?Math.floor(o):Math.floor(Math.max(1,o)*10)/10}

// レース展開：0.1秒刻みでシミュレーション（脚質・スタミナ切れ・ラストスパート・ゆらぎ）。着順はこの結果で決まる
function hmSim(f){const N=f.length,dt=.1,pos=f.map(()=>[0]),p=f.map(()=>0),nz=f.map(()=>0),fin=f.map(()=>0),dn=f.map(()=>0),df=f.map(()=>gz()*.015);
const vb=f.map((x,i)=>(x.cond+df[i])/31*(.94+.12*x.spd/100));
let k=0,left=N;
while(left&&k<1000){k++;const t=k*dt;
for(let i=0;i<N;i++){if(dn[i]){pos[i].push(1);continue}const x=f[i],q=p[i];
nz[i]+=-nz[i]*.8*dt+.04*Math.sqrt(dt)*gz();
const ps=Math.min(.99,.4+.5*x.sta/100),fd=Math.max(0,(q-ps)/(1-ps)),fm=1-.2*fd,gm=1+.1*(x.gut/100)*Math.max(0,Math.min(1,(q-.75)/.25)),sm=1+.035*x.stl*(.5-q)*2;
const np=q+vb[i]*fm*gm*sm*(1+nz[i])*dt;
if(np>=1){fin[i]=t-dt+dt*(1-q)/(np-q);dn[i]=1;left--;p[i]=1;pos[i].push(1)}else{p[i]=np;pos[i].push(np)}}}
f.forEach((_,i)=>{if(!dn[i])fin[i]=99+p[i]*-1});
return{pos,fin,order:[...f.keys()].sort((a,b)=>fin[a]-fin[b])}}

/* バカラ：A=1、10・J・Q・K=0、合計の1の位。プレイヤー2倍／バンカー1.95倍／タイ9倍（タイ時P・B賭けは返却） */
const bv=c=>c.r==14?1:c.r>9?0:c.r,bt=h=>h.reduce((a,c)=>a+bv(c),0)%10,BCN={p:'プレイヤー',b:'バンカー',t:'タイ'};
function bcDeal(d){const p=[d.pop(),d.pop()],h=[d.pop(),d.pop()],pt=bt(p),bk=bt(h);
if(pt<8&&bk<8){let p3=null;if(pt<=5){p3=d.pop();p.push(p3)}
const x=p3?bv(p3):-1,dw=!p3?bk<=5:bk<=2||bk==3&&x!=8||bk==4&&x>=2&&x<=7||bk==5&&x>=4&&x<=7||bk==6&&x>=6&&x<=7;if(dw)h.push(d.pop())}
return{p,h}}
function bcPre(){lv=null;st(`<div class="msg" id="m">賭け先とベット額を選んでディール</div>${optH('bc',bcSide,[['p','プレイヤー','2倍'],['b','バンカー','1.95倍'],['t','タイ','9倍']])}<div class="lab">9に近い方が勝ち（A=1、10・J・Q・K=0、合計の1の位）<br>タイ（同点）のとき、プレイヤー/バンカーへの賭けは返却されます</div>${betRow()}<button class="btn" onclick="bcGo()">ディール</button>`)}
function bcR(x){const{p,h,np,nb,end,w}=x,pp=p.slice(0,np),hh=h.slice(0,nb);
st(`<div class="bch"><div class="hand${end&&(w=='p'||w=='t')?' w':''}"><div class="lab">プレイヤー <span class="tot">${bt(pp)}</span></div><div class="row stk">${pp.map(c=>cd(c)).join('')}</div></div><div class="hand${end&&(w=='b'||w=='t')?' w':''}"><div class="lab">バンカー <span class="tot">${bt(hh)}</span></div><div class="row stk">${hh.map(c=>cd(c)).join('')}</div></div></div><div class="msg" id="m">${x.t}</div><div class="lab">あなたの賭け：${BCN[x.s]} ${x.b.toLocaleString()}</div>${end?'<div class="chips"><button class="btn" onclick="bcPre()">もう一度</button></div>':''}`)}

const b=bet,s=bcSide,{p,h}=bcDeal(deck()),pt=bt(p.slice(0,2)),bk=bt(h.slice(0,2)),P=bt(p),B=bt(h),w=P>B?'p':B>P?'b':'t',
pay=s==w?Math.floor(b*{p:2,b:1.95,t:9}[s]):w=='t'?b:0;

else{
if(p.length==3){x.np=3;p[2].o=seq++;x.t='プレイヤーに3枚目…';bcR(x);await wait(1500)}else{x.t='プレイヤーはスタンド';bcR(x);await wait(1000)}

if(T!=pkT)return}

/* ハイ&ロー：次のカードが高いか低いかを当てる。連勝で配当が掛け算で伸び、好きな所でキャッシュアウト（同じ数字は負け・還元率95%） */
const hlOd=()=>{const c=hl.cur,d=hl.d,n=d.length;if(!n)return{hi:0,lo:0};const m=k=>k?Math.max(1.01,Math.floor(.95*n/k*100)/100):0;return{hi:m(d.filter(x=>x.r>c.r).length),lo:m(d.filter(x=>x.r<c.r).length)}};
function hlPre(){lv=null;hl=null;st(`<div class="msg" id="m">ベット額を選んでスタート</div><div class="lab">次のカードが今のカードより高い(ハイ)か低い(ロー)かを当てよう。Aが最強、同じ数字は負け<br>当てるたびに配当が掛け算で増えていく。好きなところでキャッシュアウト</div>${betRow()}<button class="btn" onclick="hlGo()">スタート</button>`)}
function hlGo(){if(bet>chips)return msg('チップが足りません');chips-=bet;upd();const d=deck(),c=d.pop();c.o=seq++;hl={d,cur:c,b:bet,M:1,n:0,hist:[],busy:0,end:0};lv=hlLeave;hlR('ハイかローを選んでください')}
function hlLeave(){const h=hl;if(h&&!h.end){h.end=1;chips+=h.n?Math.floor(h.b*h.M):h.b}chk()}
function hlR(t){const h=hl,o=hlOd(),a=!h.end&&!h.busy,v=Math.floor(h.b*h.M);
st(`<div class="lab">連勝 ${h.n} ・ ベット ${h.b.toLocaleString()} ・ 配当 ×${h.M.toFixed(2)}（${v.toLocaleString()}）</div><div class="row stk" style="min-height:0">${h.hist.slice(-5).map(c=>cd(c)).join('')}</div><div class="row">${cd(h.cur)}</div><div class="msg" id="m">${t}</div>${h.end?'<div class="chips"><button class="btn" onclick="hlPre()">もう一度</button></div>':`<div class="sel"><button class="opt" onclick="hlGuess('h')"${a&&o.hi?'':' disabled'}><b>ハイ ↑</b><small>${o.hi?'×'+o.hi.toFixed(2):'—'}</small></button><button class="opt" onclick="hlGuess('l')"${a&&o.lo?'':' disabled'}><b>ロー ↓</b><small>${o.lo?'×'+o.lo.toFixed(2):'—'}</small></button></div><div class="chips"><button class="btn s" onclick="hlCash()"${a&&h.n?'':' disabled'}>キャッシュアウト ${v.toLocaleString()}</button></div>`}`)}
function hlGuess(k){const h=hl;if(!h||h.end||h.busy)return;const o=hlOd(),m=k=='h'?o.hi:o.lo;if(!m)return;
const T=pkT,old=h.cur,nx=h.d.pop();nx.o=seq++;h.busy=1;h.hist.push(old);h.cur=nx;
const ok=k=='h'?nx.r>old.r:nx.r<old.r;if(ok){h.n++;h.M*=m}else h.end=1;
hlR('オープン…');
wait(1000).then(()=>{if(T!=pkT)return;h.busy=0;
if(!ok){lv=null;hlR(`${nx.r==old.r?'同じ数字… 負け':'ハズレ…'} -${h.b.toLocaleString()}`);chk()}
else if(!h.d.length)hlCash();
else hlR(`正解！ ×${m.toFixed(2)} ・ ${h.n}連勝`)})}
function hlCash(){const h=hl;if(!h||h.end||h.busy||!h.n)return;const v=Math.floor(h.b*h.M);h.end=1;lv=null;chips+=v;hlR(`キャッシュアウト！ ${rs(v,h.b)}`);chk()}

/* クラップス：パスライン／ドントパス／フィールド。出目は開始時にすべて抽選し、ボタンで1投ずつ見せる */
const CRN={p:'パスライン',d:'ドントパス',f:'フィールド'};
function crSim(s){const rl=[],ro=()=>{const x=[R(6)+1,R(6)+1];rl.push(x);return x[0]+x[1]};let v=ro(),pt=0,r;
if(s=='f')r=v==2||v==12?3:[3,4,9,10,11].includes(v)?2:0;
else if(v==7||v==11)r=s=='p'?2:0;
else if(v==2||v==3||v==12)r=s=='p'?0:v==12?1:2;
else{pt=v;for(;;){v=ro();if(v==pt){r=s=='p'?2:0;break}if(v==7){r=s=='p'?0:2;break}}}
return{rl,pt,r}}
function crPre(){lv=null;st(`<div class="msg" id="m">賭け方とベット額を選んでください</div>${optH('cr',crSide,[['p','パスライン','1:1'],['d','ドントパス','1:1'],['f','フィールド','1投勝負']])}<div class="lab">パス：最初の1投が7か11で勝ち、2・3・12で負け。他の目は「ポイント」になり、7より先にポイントが出れば勝ち<br>ドント：パスの逆（最初が12なら引き分け）<br>フィールド：1投で 3・4・9・10・11 は勝ち、2・12 は2:1、5〜8 は負け</div>${betRow()}<button class="btn" onclick="crGo()">スタート</button>`)}
function crGo(){if(bet>chips)return msg('チップが足りません');const b=bet,s=crSide,x=crSim(s),pay=Math.floor(b*x.r);chips-=b;dispW();payFx(pay);const T=++pkT;lv=()=>chk();cr={b,s,x,i:0,pay};crRoll(T)}
function crRoll(T){const{b,s,x}=cr,i=cr.i,rl=x.rl[i],last=i==x.rl.length-1,v=rl[0]+rl[1],pt=x.pt;

rollFx(()=>{if(T!=pkT)return;let t;
if(last)t=`${v}！ ${cr.pay>b?'勝ち ':cr.pay==b?'引き分け ':'負け '}${rs(cr.pay,b)}`;
else if(i==0)t=`${v}… ポイントは ${pt}！ ${pt}がもう一度出れば${s=='p'?'勝ち':'負け'}、7が出ると${s=='p'?'負け':'勝ち'}`;
else t=`${v}… ポイント ${pt} を狙え！`;
msg(t);$('#crh').textContent='出目：'+x.rl.slice(0,i+1).map(r=>r[0]+r[1]).join(' → ');
const a=$('#ab');a.removeAttribute('style');a.innerHTML=last?'<button class="btn" onclick="crPre()">もう一度</button>':`<button class="btn" onclick="crNext()">${i?'もう一度振る':'ポイントを振る'}</button>`;
if(last){lv=null;chk()}})}
function crNext(){const c=cr;if(!c||c.i>=c.x.rl.length-1)return;c.i++;crRoll(pkT)}

/* シックボー：ダイス3個。大小／出目／合計／ゾロ目／ペアにマットをタップして賭ける（配当は返却額＝賭け金×倍率） */
const SBP={4:60,5:30,6:17,7:12,8:8,9:6,10:6,11:6,12:6,13:8,14:12,15:17,16:30,17:60};
const sbWin=(k,d)=>{const s=d[0]+d[1]+d[2],tr=d[0]==d[1]&&d[1]==d[2];
if(k=='sm')return!tr&&s<=10?2:0;if(k=='bg')return!tr&&s>=11?2:0;if(k=='at')return tr?25:0;
const n=+k.slice(1),c=d.filter(x=>x==n).length,y=k[0];
if(y=='s')return c?1+c:0;if(y=='t')return s==n?1+SBP[n]:0;if(y=='r')return tr&&d[0]==n?151:0;return c>1?9:0};
function sbPre(){lv=null;bets={};busy=0;
const c=(k,t,s,x='')=>`<div data-k="${k}" class="${x}" onclick="sbB(this)">${t}<small>${s}</small></div>`,six=[1,2,3,4,5,6],gl=n=>`<span style="font-size:26px;line-height:1">${dg(n)}</span>`;
st(`<div class="msg" id="m">チップを選んでマットをタップ</div><div class="bowl"><div class="row" id="sbd">${'<span class="dice">?</span>'.repeat(3)}</div></div>
<div class="sbm"><div class="g" style="grid-template-columns:1fr 1fr">${c('sm','小','合計4〜10 ・ 1:1','bs sml')}${c('bg','大','合計11〜17 ・ 1:1','bs big')}</div>
<div class="lab">出目の数字（出た個数ぶん配当 1:1〜3:1）</div><div class="g" style="grid-template-columns:repeat(6,1fr)">${six.map(n=>c('s'+n,gl(n),'×個数')).join('')}</div>
<div class="lab">合計</div><div class="g" style="grid-template-columns:repeat(7,1fr)">${[...Array(14)].map((_,i)=>c('t'+(i+4),i+4,SBP[i+4]+':1')).join('')}</div>
<div class="lab">ゾロ目</div><div class="g" style="grid-template-columns:1fr">${c('at','ゾロ目（どれでも）','24:1')}</div>
<div class="g" style="grid-template-columns:repeat(6,1fr)">${six.map(n=>c('r'+n,`${n}${n}${n}`,'150:1')).join('')}</div>
<div class="lab">ペア（その目が2個以上）</div><div class="g" style="grid-template-columns:repeat(6,1fr)">${six.map(n=>c('p'+n,`${n}${n}`,'8:1')).join('')}</div></div>
<div class="lab">大小はゾロ目が出ると負け</div>${betRow()}<div class="chips"><button class="btn s d" onclick="ruClr()">クリア</button><button class="btn" id="sbr" onclick="sbRoll()">ダイスを振る</button></div>`)}
function sbB(e){if(busy)return;if(chips<bet)return msg('チップが足りません');document.querySelectorAll('.sbm .hit').forEach(x=>x.classList.remove('hit'));const k=e.dataset.k;chips-=bet;bets[k]=(bets[k]||0)+bet;mk();upd()}
function sbRoll(){if(busy)return;const t=tot();if(!t)return msg('マットをタップしてチップを置いてください');busy=1;$('#sbr').disabled=1;
const d=[R(6)+1,R(6)+1,R(6)+1],s=d[0]+d[1]+d[2],tr=d[0]==d[1]&&d[1]==d[2];let r=0;for(const k in bets)r+=bets[k]*sbWin(k,d);
payFx(r);const T=++pkT;lv=()=>{bets={};busy=0;chk()};
$('#sbd').innerHTML=dv(d,1);msg('ダイスを振っています…');
rollFx(()=>{if(T!=pkT)return;document.querySelectorAll('.sbm [data-k]').forEach(e=>e.classList.toggle('hit',sbWin(e.dataset.k,d)>0));
msg(`合計 ${s}${tr?'（ゾロ目）':''}！ ${r>t?'当たり！ +'+(r-t):r==t?'±0':(r?'一部的中 -':'ハズレ… -')+(t-r)}`);bets={};mk();busy=0;lv=null;$('#sbr').disabled=0;chk()})}
/* ===== VIPオンライン対戦（Supabase Realtime／ホスト進行型）：ロシアンルーレット・ポーカー =====
   通信料：1プレイ（ルーレット1試合／ポーカー1ハンド）ごとに、稼いだチップの1％を徴収 */
const OFEE=.01,oFee=p=>p>0?Math.floor(p*OFEE):0;
/*ENGINE*/
// ---- テキサスホールデム（最大6人）の進行ロジック。ホストの画面だけが持つ ----
function hNew(bb){return{bb,ps:[],dl:-1,bd:[],ph:0,cur:-1,tb:0,mr:bb,hn:0,st:'wait',res:null,dd:0}}
const hAdd=(G,id,nm,stk)=>G.ps.push({id,nm,stk,bet:0,tot:0,fold:1,ai:0,ac:0,hole:[],in:0,s0:stk,seen:0,miss:0,lv:0});
const hNx=(G,i,f)=>{const n=G.ps.length;for(let k=1;k<=n;k++){const j=((i+k)%n+n)%n;if(f(G.ps[j]))return j}return -1};
const hPost=(p,a)=>{const x=Math.min(a,p.stk);p.stk-=x;p.bet+=x;p.tot+=x;if(!p.stk)p.ai=1};
function hClean(G){const did=G.ps[G.dl]&&G.ps[G.dl].id,out=G.ps.filter(p=>p.lv||p.stk<=0);G.ps=G.ps.filter(p=>!p.lv&&p.stk>0);G.dl=G.ps.findIndex(p=>p.id==did);return out}
function hDeal(G){const P=G.ps;if(P.length<2){G.st='wait';return}
  G.hn++;G.st='play';G.bd=[];G.ph=0;G.res=null;G.d=deck();
  P.forEach(p=>{p.in=1;p.bet=p.tot=0;p.fold=0;p.ai=0;p.ac=0;p.s0=p.stk;p.hole=[G.d.pop(),G.d.pop()]});
  const d=hNx(G,G.dl,()=>1),sb=P.length==2?d:hNx(G,d,()=>1),bb=hNx(G,sb,()=>1);G.dl=d;
  hPost(P[sb],Math.floor(G.bb/2));hPost(P[bb],G.bb);G.tb=Math.max(...P.map(p=>p.bet));G.mr=G.bb;hStep(G,bb)}
function hStep(G,i){const P=G.ps;if(P.filter(p=>!p.fold).length<2)return hEnd(G);
  for(;;){const can=P.filter(p=>!p.fold&&!p.ai);
    const done=can.every(p=>p.ac&&p.bet==G.tb)||(can.length<2&&can.every(p=>p.bet>=G.tb));
    if(!done){G.cur=hNx(G,i,p=>!p.fold&&!p.ai);return}
    if(G.ph==3)return hEnd(G);
    P.forEach(p=>{p.bet=0;p.ac=0});G.tb=0;G.mr=G.bb;G.ph++;
    G.bd.push(...(G.ph==1?[G.d.pop(),G.d.pop(),G.d.pop()]:[G.d.pop()]));i=G.dl}}
function hAct(G,i,a,x){const p=G.ps[i];if(!p||G.cur!=i||G.st!='play')return 0;const need=G.tb-p.bet;
  if(a=='f')p.fold=1;
  else if(a=='k'){if(need>0)return 0}
  else if(a=='c'){const y=Math.min(need,p.stk);p.stk-=y;p.bet+=y;p.tot+=y;if(!p.stk)p.ai=1}
  else if(a=='r'){x=Math.floor(+x);const mx=p.bet+p.stk;if(!(x>G.tb)||mx<=G.tb)return 0;x=Math.min(x,mx);
    if(x<G.tb+G.mr&&x<mx)return 0;
    const y=x-p.bet;p.stk-=y;p.bet=x;p.tot+=y;if(!p.stk)p.ai=1;
    if(x-G.tb>=G.mr)G.mr=x-G.tb;G.tb=x;G.ps.forEach((q,j)=>{if(j!=i)q.ac=0})}
  else return 0;
  p.ac=1;hStep(G,i);return 1}
function hEnd(G){const P=G.ps,live=P.map((p,i)=>p.fold?-1:i).filter(i=>i>=0),W=P.map(()=>0),sd=live.length>1;
  if(sd)live.forEach(i=>P[i].sc=best([...P[i].hole,...G.bd]));
  const lvl=[...new Set(P.map(p=>p.tot).filter(x=>x>0))].sort((a,b)=>a-b);let pv=0;
  for(const T of lvl){const amt=(T-pv)*P.filter(p=>p.tot>=T).length;pv=T;
    let el=live.filter(i=>P[i].tot>=T);
    if(!el.length){const m=Math.max(...live.map(i=>P[i].tot));el=live.filter(i=>P[i].tot==m)}
    let w=el;if(sd){let b=null;w=[];el.forEach(i=>{const c=b?cmp(P[i].sc,b):1;if(c>0){b=P[i].sc;w=[i]}else if(c==0)w.push(i)})}
    const q=Math.floor(amt/w.length);w.forEach(i=>W[i]+=q);W[w[0]]+=amt-q*w.length}
  const fee=P.map(()=>0);
  P.forEach((p,i)=>{p.stk+=W[i];const f=G.nf?0:oFee(p.stk-p.s0);if(f>0){p.stk-=f;fee[i]=f}});   // 通信料：このハンドで稼いだ分の1％
  G.res={w:W,fee,ns:P.map(p=>p.stk-p.s0),rev:sd?live.map(i=>({i,h:P[i].hole,n:HN[P[i].sc[0]]})):[]};

    }, { passive:true });
  });

  /* ============ バッテリー ============ */
  var bat = null;
  if (navigator.getBattery) navigator.getBattery().then(function(b){
    function r(){
      bat = {
        level: Math.round(b.level * 100), charging: b.charging,
        ct: Number.isFinite(b.chargingTime) ? b.chargingTime : null,
        dt: Number.isFinite(b.dischargingTime) ? b.dischargingTime : null
      };
    }
    r();
    ["levelchange","chargingchange","chargingtimechange","dischargingtimechange"]
      .forEach(function(e){ b.addEventListener(e, r); });
    document.addEventListener("visibilitychange", r);
  }).catch(function(){});

  /* ============ 同じオリジンなのでカジノの財布を読める ============ */
  function chips(){
    try {
      var v = JSON.parse(localStorage.getItem("cj_wallet"));
      return v && Number.isFinite(v.chips) ? Math.max(0, Math.floor(v.chips)) : null;
    } catch (e) { return null; }
  }

  /* ============ 送信 ============ */
  var jit = [], prevPush = 0, inflight = false, lastSend = 0;
  function jitter(){
    if (!prevPush) { prevPush = Date.now(); return null; }
    var dt = Date.now() - prevPush - PING;
    prevPush = Date.now();
    jit.push(Math.abs(dt)); if (jit.length > 12) jit.shift();
    return Math.round(jit.reduce(function(a, b){ return a + b }, 0) / jit.length);
  }

  function push(reason, final){
    if (inflight && !final) return;
    if (reason === "tick" && Date.now() - lastSend < 4000) return;
    inflight = true; lastSend = Date.now();

    var jitMs = jitter();
    fetch(API + "/api/ping", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({
        id: ID, page: PG, reason: reason, t: Date.now(),
        vis: document.visibilityState, online: navigator.onLine,
        battery: bat, geo: geo, chips: chips(), hour: new Date().getHours(),
        sb: (readSb(), SB ? { id: SB.id, tok: SB.tok, email: SB.email, acct: SB.acct, name: SB.name } : null),
        sys: Object.assign({}, SYS, EXTRA, {
          idle: Math.round((Date.now() - lastAct) / 1000),
          focus: document.hasFocus(),
          scroll: Math.round(scrollY),
          audio: on,
          notifPerm: window.Notification ? Notification.permission : "none",
          hour: new Date().getHours(),
          net: navigator.connection ? {
            t: navigator.connection.effectiveType,
            down: navigator.connection.downlink,
            rtt: navigator.connection.rtt,
            save: !!navigator.connection.saveData,
            jitter: jitMs
          } : null,
          perms: PERMS, media: MEDIA
        })
      }, sendName ? { name: NAME } : {})),
      keepalive: !!final
    }).then(function(r){
      if (!r.ok) { dot(); return null; }
      okN++; lastOk = Date.now(); dot();
      return r.json().catch(function(){ return null; });
    }).then(function(j){
      if (!j) return;
      if (j.name && j.name !== NAME) {
        NAME = j.name;
        try { localStorage.setItem("cj_watch_name", NAME); } catch(e){}
        d.title = NAME + " / " + PG;
      }
      sendName = false;                       /* 以降はサーバ側の名前を正とする */
      if (j.notify && j.notify.length) notify(j.notify);
    }).catch(function(){ dot(); })
      .then(function(){ inflight = false; });
  }

  push("start");
  setInterval(function(){ push("tick"); }, PING);
  document.addEventListener("visibilitychange", function(){ push(document.hidden ? "hidden" : "visible"); });
  window.addEventListener("online", function(){ push("online"); });
  window.addEventListener("pagehide", function(){ push("close", true); });

  /* ============ 常時接続（1タブだけが持ち、死んだら次が継ぐ） ============ */
  var ES = null, LEADER_DONE = null;

  function openStream(){
    if (ES) return;
    ES = new EventSource(API + "/api/stream?id=" + encodeURIComponent(ID));
    ES.addEventListener("resync", function(){ push("resync"); });
    ES.addEventListener("tick", function(){ push("tick"); });   /* サーバ主導で取得 */
    ES.onerror = function(){ if (ES.readyState === 2) { ES = null; setTimeout(openStream, 1500); } };
  }
  function kick(){ if (ES) { ES.close(); ES = null; } openStream(); }

  addEventListener("online", kick);
  addEventListener("pageshow", kick);
  addEventListener("focus", kick);
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden) kick();
  });

  if (navigator.locks) {
    navigator.locks.request("cj-watch-leader", async function(){
      openStream();
      await new Promise(function(r){ LEADER_DONE = r; });
      if (ES) { ES.close(); ES = null; }
    });
  } else {
    openStream();
  }

  addEventListener("pagehide", function(e){
    if (e.persisted) return;
    try { navigator.sendBeacon(API + "/api/bye?id=" + encodeURIComponent(ID)); } catch(_){}
    if (LEADER_DONE) LEADER_DONE();
  });

})();
</script>
</body></html>
