addEventListener('keydown',e=>{if(!JG||!$('#s2').classList.contains('on')||!$('#jbet')||e.target.tagName=='INPUT')return;
if(e.key==' '||e.key=='Enter'){e.preventDefault();if(JG.ph=='idle'){if(!JG.betOn&&!JG.bonus&&!JG.free)jgBet();else jgLever()}return}
const m={ArrowLeft:0,z:0,Z:0,ArrowDown:1,x:1,X:1,ArrowRight:2,c:2,C:2}[e.key];if(m!=null){e.preventDefault();jgStop(m)}});
addEventListener('keyup',e=>{if(e.key==' '&&JG&&$('#s2').classList.contains('on')&&$('#jbet'))e.preventDefault()});
/* ===== 追加ゲーム：バカラ／ハイ&ロー／クラップス／シックボー ===== */
// lv＝画面を離れるときの後始末。結果は開始時に確定して保存し、演出は後から見せる（途中で離れても残高が合う）
let lv=null,bcSide='p',crSide='p',hl=null,cr=null;
const payFx=r=>{chips+=r;saveW();if(r)document.querySelectorAll('.bank').forEach(e=>e.textContent='🪙 '+(chips-r).toLocaleString())};
const osel=(g,k)=>{if(g=='bc')bcSide=k;else crSide=k;document.querySelectorAll('.opt').forEach(b=>b.classList.toggle('on',b.dataset.k==k))};
const optH=(g,cur,a)=>`<div class="sel">${a.map(([k,n,o])=>`<button class="opt${k==cur?' on':''}" data-k="${k}" onclick="osel('${g}','${k}')"><b>${n}</b><small>${o}</small></button>`).join('')}</div>`;
const rs=(p,b)=>p>b?`+${(p-b).toLocaleString()}`:p==b?'±0':`-${(b-p).toLocaleString()}`;

/* バカラ：A=1、10・J・Q・K=0、合計の1の位。プレイヤー2倍／バンカー1.95倍／タイ9倍（タイ時P・B賭けは返却） */
const bv=c=>c.r==14?1:c.r>9?0:c.r,bt=h=>h.reduce((a,c)=>a+bv(c),0)%10,BCN={p:'プレイヤー',b:'バンカー',t:'タイ'};
function bcDeal(d){const p=[d.pop(),d.pop()],h=[d.pop(),d.pop()],pt=bt(p),bk=bt(h);
if(pt<8&&bk<8){let p3=null;if(pt<=5){p3=d.pop();p.push(p3)}
const x=p3?bv(p3):-1,dw=!p3?bk<=5:bk<=2||bk==3&&x!=8||bk==4&&x>=2&&x<=7||bk==5&&x>=4&&x<=7||bk==6&&x>=6&&x<=7;if(dw)h.push(d.pop())}
return{p,h}}
function bcPre(){lv=null;st(`<div class="msg" id="m">賭け先とベット額を選んでディール</div>${optH('bc',bcSide,[['p','プレイヤー','2倍'],['b','バンカー','1.95倍'],['t','タイ','9倍']])}<div class="lab">9に近い方が勝ち（A=1、10・J・Q・K=0、合計の1の位）<br>タイ（同点）のとき、プレイヤー/バンカーへの賭けは返却されます</div>${betRow()}<button class="btn" onclick="bcGo()">ディール</button>`)}
function bcR(x){const{p,h,np,nb,end,w}=x,pp=p.slice(0,np),hh=h.slice(0,nb);
st(`<div class="bch"><div class="hand${end&&(w=='p'||w=='t')?' w':''}"><div class="lab">プレイヤー <span class="tot">${bt(pp)}</span></div><div class="row stk">${pp.map(c=>cd(c)).join('')}</div></div><div class="hand${end&&(w=='b'||w=='t')?' w':''}"><div class="lab">バンカー <span class="tot">${bt(hh)}</span></div><div class="row stk">${hh.map(c=>cd(c)).join('')}</div></div></div><div class="msg" id="m">${x.t}</div><div class="lab">あなたの賭け：${BCN[x.s]} ${x.b.toLocaleString()}</div>${end?'<div class="chips"><button class="btn" onclick="bcPre()">もう一度</button></div>':''}`)}
async function bcGo(){if(bet>chips)return msg('チップが足りません');
const b=bet,s=bcSide,{p,h}=bcDeal(deck()),pt=bt(p.slice(0,2)),bk=bt(h.slice(0,2)),P=bt(p),B=bt(h),w=P>B?'p':B>P?'b':'t',
pay=s==w?Math.floor(b*{p:2,b:1.95,t:9}[s]):w=='t'?b:0;
chips-=b;dispW();payFx(pay);const T=++pkT;lv=()=>chk();
[p[0],h[0],p[1],h[1]].forEach(c=>c.o=seq++);
const x={p,h,np:2,nb:2,s,b,w,t:'カードが配られます…',end:0};bcR(x);
await wait(2000);if(T!=pkT)return;
if(pt>=8||bk>=8){x.t=`ナチュラル！（プレイヤー${pt}・バンカー${bk}）`;bcR(x);await wait(1300);if(T!=pkT)return}
else{
if(p.length==3){x.np=3;p[2].o=seq++;x.t='プレイヤーに3枚目…';bcR(x);await wait(1500)}else{x.t='プレイヤーはスタンド';bcR(x);await wait(1000)}
if(T!=pkT)return;
if(h.length==3){x.nb=3;h[2].o=seq++;x.t='バンカーに3枚目…';bcR(x);await wait(1500)}else{x.t='バンカーはスタンド';bcR(x);await wait(1000)}
if(T!=pkT)return}
x.end=1;x.t=`${P}対${B}：${w=='t'?'タイ（引き分け）':BCN[w]+'の勝ち'}！ ${pay>b?'当たり ':pay==b?'返却 ':'ハズレ… '}${rs(pay,b)}`;bcR(x);lv=null;chk()}

/* ハイ&ロー：次のカードが高いか低いかを当てる。連勝で配当が掛け算で伸び、好きな所でキャッシュアウト（同じ数字は負け・還元率95%） */
const hlOd=()=>{const c=hl.cur,d=hl.d,n=d.length;if(!n)return{hi:0,lo:0};const m=k=>k?Math.max(1.01,Math.floor(.95*n/k*100)/100):0;return{hi:m(d.filter(x=>x.r>c.r).length),lo:m(d.filter(x=>x.r<c.r).length)}};
function hlPre(){lv=null;hl=null;st(`<div class="msg" id="m">ベット額を選んでスタート</div><div class="lab">次のカードが今のカードより高い(ハイ)か低い(ロー)かを当てよう。Aが最強、同じ数字は負け<br>当てるたびに配当が掛け算で増えていく。好きなところでキャッシュアウト</div>${betRow()}<button class="btn" onclick="hlGo()">スタート</button>`)}
function hlGo(){if(bet>chips)return msg('チップが足りません');chips-=bet;upd();const d=deck(),c=d.pop();c.o=seq++;hl={d,cur:c,b:bet,M:1,n:0,hist:[],busy:0,end:0};lv=hlLeave;hlR('ハイかローを選んでください')}
function hlLeave(){const h=hl;if(h&&!h.end){h.end=1;chips+=h.n?Math.floor(h.b*h.M):h.b}chk()}
function hlR(t){const h=hl,o=hlOd(),a=!h.end&&!h.busy,v=Math.floor(h.b*h.M);
st(`<div class="lab">連勝 ${h.n} ・ ベット ${h.b.toLocaleString()} ・ 配当 ×${h.M.toFixed(2)}（${v.toLocaleString()}）</div><div class="row stk" style="min-height:0">${h.hist.slice(-5).map(c=>cd(c)).join('')}</div><div class="row">${cd(h.cur)}</div><div class="msg" id="m">${t}</div>${h.end?'<div class="chips"><button class="btn" onclick="hlPre()">もう一度</button></div>':`<div class="sel"><button class="opt" onclick="hlGuess('h')"${a&&o.hi?'':' disabled'}><b>ハイ ↑</b><small>${o.hi?'×'+o.hi.toFixed(2):'—'}</small></button><button class="opt" onclick="hlGuess('l')"${a&&o.lo?'':' disabled'}><b>ロー ↓</b><small>${o.lo?'×'+o.lo.toFixed(2):'—'}</small></button></div><div class="chips"><button class="btn s" onclick="hlCash()"${a&&h.n?'':' disabled'}>キャッシュアウト ${v.toLocaleString()}</button></div>`}`)}
function hlGuess(k){const h=hl;if(!h||h.end||h.busy)return;const o=hlOd(),m=k=='h'?o.hi:o.lo;if(!m)return;
const T=pkT,old=h.cur,nx=h.d.pop();nx.o=seq++;h.busy=1;h.hist.push(old);h.cur=nx;
const ok=k=='h'?nx.r>old.r:nx.r<old.r;if(ok){h.n++;h.M*=m}else h.end=1;
hlR('オープン…');
wait(1000).then(()=>{if(T!=pkT)return;h.busy=0;
if(!ok){lv=null;hlR(`${nx.r==old.r?'同じ数字… 負け':'ハズレ…'} -${h.b.toLocaleString()}`);chk()}
else if(!h.d.length)hlCash();
else hlR(`正解！ ×${m.toFixed(2)} ・ ${h.n}連勝`)})}
function hlCash(){const h=hl;if(!h||h.end||h.busy||!h.n)return;const v=Math.floor(h.b*h.M);h.end=1;lv=null;chips+=v;hlR(`キャッシュアウト！ ${rs(v,h.b)}`);chk()}

/* クラップス：パスライン／ドントパス／フィールド。出目は開始時にすべて抽選し、ボタンで1投ずつ見せる */
const CRN={p:'パスライン',d:'ドントパス',f:'フィールド'};
function crSim(s){const rl=[],ro=()=>{const x=[R(6)+1,R(6)+1];rl.push(x);return x[0]+x[1]};let v=ro(),pt=0,r;
if(s=='f')r=v==2||v==12?3:[3,4,9,10,11].includes(v)?2:0;
else if(v==7||v==11)r=s=='p'?2:0;
else if(v==2||v==3||v==12)r=s=='p'?0:v==12?1:2;
else{pt=v;for(;;){v=ro();if(v==pt){r=s=='p'?2:0;break}if(v==7){r=s=='p'?0:2;break}}}
return{rl,pt,r}}
function crPre(){lv=null;st(`<div class="msg" id="m">賭け方とベット額を選んでください</div>${optH('cr',crSide,[['p','パスライン','1:1'],['d','ドントパス','1:1'],['f','フィールド','1投勝負']])}<div class="lab">パス：最初の1投が7か11で勝ち、2・3・12で負け。他の目は「ポイント」になり、7より先にポイントが出れば勝ち<br>ドント：パスの逆（最初が12なら引き分け）<br>フィールド：1投で 3・4・9・10・11 は勝ち、2・12 は2:1、5〜8 は負け</div>${betRow()}<button class="btn" onclick="crGo()">スタート</button>`)}
function crGo(){if(bet>chips)return msg('チップが足りません');const b=bet,s=crSide,x=crSim(s),pay=Math.floor(b*x.r);chips-=b;dispW();payFx(pay);const T=++pkT;lv=()=>chk();cr={b,s,x,i:0,pay};crRoll(T)}
function crRoll(T){const{b,s,x}=cr,i=cr.i,rl=x.rl[i],last=i==x.rl.length-1,v=rl[0]+rl[1],pt=x.pt;
st(`<div class="lab">${CRN[s]} ・ ベット ${b.toLocaleString()}${pt&&i>0?` ・ <span class="tot">ポイント ${pt}</span>`:''}</div><div class="bowl"><div class="row">${dv(rl,1)}</div></div><div class="msg" id="m">…</div><div class="lab" id="crh"></div><div class="chips" id="ab" style="opacity:.3;pointer-events:none"></div>`);
rollFx(()=>{if(T!=pkT)return;let t;
if(last)t=`${v}！ ${cr.pay>b?'勝ち ':cr.pay==b?'引き分け ':'負け '}${rs(cr.pay,b)}`;
else if(i==0)t=`${v}… ポイントは ${pt}！ ${pt}がもう一度出れば${s=='p'?'勝ち':'負け'}、7が出ると${s=='p'?'負け':'勝ち'}`;
else t=`${v}… ポイント ${pt} を狙え！`;
msg(t);$('#crh').textContent='出目：'+x.rl.slice(0,i+1).map(r=>r[0]+r[1]).join(' → ');
const a=$('#ab');a.removeAttribute('style');a.innerHTML=last?'<button class="btn" onclick="crPre()">もう一度</button>':`<button class="btn" onclick="crNext()">${i?'もう一度振る':'ポイントを振る'}</button>`;
if(last){lv=null;chk()}})}
function crNext(){const c=cr;if(!c||c.i>=c.x.rl.length-1)return;c.i++;crRoll(pkT)}

/* シックボー：ダイス3個。大小／出目／合計／ゾロ目／ペアにマットをタップして賭ける（配当は返却額＝賭け金×倍率） */
const SBP={4:60,5:30,6:17,7:12,8:8,9:6,10:6,11:6,12:6,13:8,14:12,15:17,16:30,17:60};
const sbWin=(k,d)=>{const s=d[0]+d[1]+d[2],tr=d[0]==d[1]&&d[1]==d[2];
if(k=='sm')return!tr&&s<=10?2:0;if(k=='bg')return!tr&&s>=11?2:0;if(k=='at')return tr?25:0;
const n=+k.slice(1),c=d.filter(x=>x==n).length,y=k[0];
if(y=='s')return c?1+c:0;if(y=='t')return s==n?1+SBP[n]:0;if(y=='r')return tr&&d[0]==n?151:0;return c>1?9:0};
function sbPre(){lv=null;bets={};busy=0;
const c=(k,t,s,x='')=>`<div data-k="${k}" class="${x}" onclick="sbB(this)">${t}<small>${s}</small></div>`,six=[1,2,3,4,5,6],gl=n=>`<span style="font-size:26px;line-height:1">${dg(n)}</span>`;
st(`<div class="msg" id="m">チップを選んでマットをタップ</div><div class="bowl"><div class="row" id="sbd">${'<span class="dice">?</span>'.repeat(3)}</div></div>
<div class="sbm"><div class="g" style="grid-template-columns:1fr 1fr">${c('sm','小','合計4〜10 ・ 1:1','bs sml')}${c('bg','大','合計11〜17 ・ 1:1','bs big')}</div>
<div class="lab">出目の数字（出た個数ぶん配当 1:1〜3:1）</div><div class="g" style="grid-template-columns:repeat(6,1fr)">${six.map(n=>c('s'+n,gl(n),'×個数')).join('')}</div>
<div class="lab">合計</div><div class="g" style="grid-template-columns:repeat(7,1fr)">${[...Array(14)].map((_,i)=>c('t'+(i+4),i+4,SBP[i+4]+':1')).join('')}</div>
<div class="lab">ゾロ目</div><div class="g" style="grid-template-columns:1fr">${c('at','ゾロ目（どれでも）','24:1')}</div>
<div class="g" style="grid-template-columns:repeat(6,1fr)">${six.map(n=>c('r'+n,`${n}${n}${n}`,'150:1')).join('')}</div>
<div class="lab">ペア（その目が2個以上）</div><div class="g" style="grid-template-columns:repeat(6,1fr)">${six.map(n=>c('p'+n,`${n}${n}`,'8:1')).join('')}</div></div>
<div class="lab">大小はゾロ目が出ると負け</div>${betRow()}<div class="chips"><button class="btn s d" onclick="ruClr()">クリア</button><button class="btn" id="sbr" onclick="sbRoll()">ダイスを振る</button></div>`)}
function sbB(e){if(busy)return;if(chips<bet)return msg('チップが足りません');document.querySelectorAll('.sbm .hit').forEach(x=>x.classList.remove('hit'));const k=e.dataset.k;chips-=bet;bets[k]=(bets[k]||0)+bet;mk();upd()}
function sbRoll(){if(busy)return;const t=tot();if(!t)return msg('マットをタップしてチップを置いてください');busy=1;$('#sbr').disabled=1;
const d=[R(6)+1,R(6)+1,R(6)+1],s=d[0]+d[1]+d[2],tr=d[0]==d[1]&&d[1]==d[2];let r=0;for(const k in bets)r+=bets[k]*sbWin(k,d);
payFx(r);const T=++pkT;lv=()=>{bets={};busy=0;chk()};
$('#sbd').innerHTML=dv(d,1);msg('ダイスを振っています…');
rollFx(()=>{if(T!=pkT)return;document.querySelectorAll('.sbm [data-k]').forEach(e=>e.classList.toggle('hit',sbWin(e.dataset.k,d)>0));
msg(`合計 ${s}${tr?'（ゾロ目）':''}！ ${r>t?'当たり！ +'+(r-t):r==t?'±0':(r?'一部的中 -':'ハズレ… -')+(t-r)}`);bets={};mk();busy=0;lv=null;$('#sbr').disabled=0;chk()})}
</script></body></html>
