<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ゲームは後。いまは勉強。</title>
<style>
  :root { --accent:#ff4d5e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; overflow:hidden; background:#0b0d1a; color:#fff;
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif; }
  #bg { position:fixed; inset:0; display:block; }
  .ui { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:space-between; padding:8vh 5vw 8vh; pointer-events:none; text-align:center; }
  h1 { font-size:clamp(30px,6.5vw,68px); font-weight:900; letter-spacing:.06em; line-height:1.3;
    text-shadow:0 0 24px rgba(255,77,94,.6); }
  h1 em { font-style:normal; color:var(--accent); }
  .sub { margin-top:1.6vh; font-size:clamp(14px,2.2vw,22px); opacity:.85; min-height:1.6em; transition:opacity .5s; }
  .foot { font-size:clamp(14px,2vw,20px); font-weight:700; letter-spacing:.12em; opacity:.9; }
  .foot span { color:#ffd24d; }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div class="ui">
  <div>
    <h1>ゲームは<em>あと</em>で。<br>いまは<em>勉強</em>の時間。</h1>
    <p class="sub" id="msg"></p>
  </div>
  <p class="foot">ゲームは、テストが終わった<span>ご褒美</span>に。</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  // ===== メッセージ =====
  var msgs = [
    "コントローラーを置いて、ノートを開こう。",
    "ゲームはテストが終わってからの最高のご褒美。",
    "まずは1問だけ解いてみよう。",
    "未来の自分が、いまの努力に感謝する。",
    "スマホは裏返し。机に向かおう。",
    "迷う時間があるなら、1ページ進めよう。",
    "終わったあとのゲームは、何倍も楽しい。"
  ];
  var msgEl = document.getElementById('msg'), mi = 0;
  function showMsg() {
    msgEl.style.opacity = 0;
    setTimeout(function () { msgEl.textContent = msgs[mi % msgs.length]; msgEl.style.opacity = .85; mi++; }, 300);
  }
  showMsg();
  setInterval(showMsg, 5500);

  // ===== three.js =====
  var canvas = document.getElementById('bg');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  var scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0b0d1a, 0.035);
  var camera = new THREE.PerspectiveCamera(55, 1, 0.1, 100);
  camera.position.set(0, 0.3, 9);

  scene.add(new THREE.AmbientLight(0x8890b0, 0.7));
  var key = new THREE.PointLight(0xff4d5e, 1.6, 40); key.position.set(-5, 4, 6); scene.add(key);
  var fill = new THREE.PointLight(0x4dd2ff, 1.2, 40); fill.position.set(6, -3, 5); scene.add(fill);

  // --- コントローラー（禁止マーク付き） ---
  var pad = new THREE.Group();
  var dark = new THREE.MeshStandardMaterial({ color: 0x3a4157, roughness: .45, metalness: .3 });
  pad.add(new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.9, 0.5), dark));
  [-1, 1].forEach(function (s) {
    var grip = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.4, 0.5, 24), dark);
    grip.rotation.x = Math.PI / 2; grip.position.set(s * 1.15, -0.35, 0); grip.rotation.z = s * 0.2; pad.add(grip);
  });
  var white = new THREE.MeshStandardMaterial({ color: 0xdfe4f5, roughness: .4 });
  var h = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.15, 0.14), white); h.position.set(-0.8, 0.05, 0.3);
  var v = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.5, 0.14), white); v.position.copy(h.position);
  pad.add(h, v);
  [[0.8, 0.3, 0xff4d5e], [1.05, 0.05, 0x4dd2ff], [0.8, -0.2, 0x7dff9a], [0.55, 0.05, 0xffd24d]].forEach(function (b) {
    var btn = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16),
      new THREE.MeshStandardMaterial({ color: b[2], emissive: b[2], emissiveIntensity: .35 }));
    btn.position.set(b[0], b[1], 0.3); pad.add(btn);
  });
  var banMat = new THREE.MeshStandardMaterial({ color: 0xff2d44, emissive: 0xff1030, emissiveIntensity: .9 });
  var ring = new THREE.Mesh(new THREE.TorusGeometry(2.3, 0.14, 20, 80), banMat);
  var slash = new THREE.Mesh(new THREE.BoxGeometry(4.3, 0.26, 0.2), banMat);
  slash.rotation.z = -Math.PI / 4;
  var ban = new THREE.Group(); ban.add(ring, slash); ban.position.z = 0.35; pad.add(ban);
  scene.add(pad);

  // --- 周回する本 ---
  var books = [], bookCols = [0xff6b6b, 0xffd24d, 0x4dd2ff, 0x7dff9a, 0xb48bff, 0xff9f4d, 0x6b8bff];
  bookCols.forEach(function (c, i) {
    var g = new THREE.Group();
    var cover = new THREE.Mesh(new THREE.BoxGeometry(0.75, 1.0, 0.18),
      new THREE.MeshStandardMaterial({ color: c, roughness: .5, emissive: c, emissiveIntensity: .12 }));
    var pages = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.94, 0.14),
      new THREE.MeshStandardMaterial({ color: 0xf5f1e6, roughness: .9 }));
    pages.position.x = 0.04;
    g.add(cover, pages); scene.add(g);
    books.push({ g: g, a: i / bookCols.length * Math.PI * 2, y: (Math.random() - .5) * 1.8, ph: Math.random() * 6.28 });
  });

  // --- 星 ---
  var N = 900, pos = new Float32Array(N * 3);
  for (var i = 0; i < N; i++) {
    pos[i*3] = (Math.random() - .5) * 40; pos[i*3+1] = (Math.random() - .5) * 26; pos[i*3+2] = -Math.random() * 30 + 4;
  }
  var pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  var stars = new THREE.Points(pg, new THREE.PointsMaterial({ color: 0xffffff, size: 0.07, transparent: true, opacity: .8 }));
  scene.add(stars);

  // --- マウス視差 ---
  var mx = 0, my = 0;
  window.addEventListener('pointermove', function (e) {
    mx = (e.clientX / innerWidth - .5) * 2; my = (e.clientY / innerHeight - .5) * 2;
  });

  function resize() {
    var w = innerWidth, hh = innerHeight;
    renderer.setSize(w, hh, false); camera.aspect = w / hh;
    camera.position.z = w / hh < 0.8 ? 12 : 9;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize); resize();

  var clock = new THREE.Clock();
  function loop() {
    var t = clock.getElapsedTime();

    pad.position.y = 0.4 + Math.sin(t * 1.2) * 0.15;
    pad.rotation.y = Math.sin(t * .7) * 0.5;
    pad.rotation.z = Math.sin(t * 1.7) * 0.06;
    ban.rotation.z = t * 0.4;
    banMat.emissiveIntensity = .6 + Math.sin(t * 4) * .3;

    books.forEach(function (b) {
      b.a += 0.004;
      b.g.position.set(Math.cos(b.a) * 4.2, b.y + Math.sin(t + b.ph) * .25, Math.sin(b.a) * 2.5 - 1);
      b.g.rotation.y = -b.a + Math.PI / 2 + Math.sin(t + b.ph) * .3;
      b.g.rotation.z = Math.sin(t * .8 + b.ph) * .15;
    });

    stars.rotation.y = t * 0.01; stars.rotation.x = t * 0.004;

    camera.position.x += (mx * 0.8 - camera.position.x) * 0.05;
    camera.position.y += (-my * 0.5 + 0.3 - camera.position.y) * 0.05;
    camera.lookAt(0, 0, 0);

    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
